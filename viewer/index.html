.lanes .dot-check { fill: none; stroke: var(--ground); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.lanes .dot.gone, .lanes .dot.ghost { fill: var(--ground); stroke: #8A8A95; stroke-width: 1.5; }
.lanes .dot.ghost { stroke-dasharray: 2.5 2; }
.lanes .flag { fill: var(--text); }
/* The Commits tab. */
.cm-pre .rd { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--text-3); justify-self: center; transition: box-shadow var(--fast) var(--ease); }
.cm-pre[aria-pressed="true"] { background: var(--raised); }
.cm-pre[aria-pressed="true"] .rd { box-shadow: inset 0 0 0 4px var(--accent); }
.cm-list { display: grid; }
.cm-row { appearance: none; position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: 1fr 1fr; column-gap: 8px; align-items: center; width: 100%; height: 40px; padding: 0 8px 0 0; border: 0; border-radius: 6px; background: none; color: var(--text); font: 400 12.5px/1.25 var(--ui); text-align: left; cursor: pointer; transition: background-color var(--fast) var(--ease); }
.cm-row > .lanes { grid-row: 1 / span 2; align-self: stretch; }
.cm-row:hover { background: var(--hover-soft); }
.cm-row.in { background: var(--accent-soft); }
.cm-row:disabled { cursor: default; }
.cm-s { align-self: end; padding-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-m { align-self: start; padding-top: 2px; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-m code, .hs-m code, .cm-start code, .hs-start code, .hs-sub code { font: 500 10.5px var(--code); color: var(--text-3); }
.cm-n { grid-row: 1 / span 2; grid-column: 3; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.cm-n.left { color: var(--accent-ink); }
/* The list follows the chain open: its commits stand out (one of its own is ringed), the rest fade. */
.cm-list.follow .cm-row:not(.mine) { opacity: .38; }
.cm-list.follow .cm-row:not(.mine):hover, .cm-list.follow .cm-row:not(.mine):focus-visible { opacity: .8; }
.cm-row.hl { background: var(--hover-soft); }
.cm-m b { font-weight: 600; color: var(--text-2); }
.lanes .ring { fill: none; stroke: var(--text-2); stroke-width: 1.2; }
.cm-n.ok, .hs-n.ok { color: var(--done); display: grid; }
.cm-n.ok svg, .hs-n.ok svg { width: 12px; height: 12px; }
.cm-row.gone .cm-s, .cm-row.old-head .cm-s { color: var(--text-3); }
.cm-flag, .hs-flag { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; padding: 0 8px 0 0; border: 0; border-radius: 6px; background: none; color: var(--text-2); font: 400 11.5px/1 var(--ui); text-align: left; cursor: pointer; }
.cm-flag b, .hs-flag b { font-weight: 600; color: var(--text); white-space: nowrap; }
.cm-flag::after, .hs-flag::after { content: ""; flex: 1; border-top: 1px dashed var(--text-4); }
.cm-flag:hover, .hs-flag:hover { background: var(--hover-soft); }
.cm-flag.in, .hs-flag.in { background: var(--accent-soft); }
.cm-start { padding: 8px 8px 0; font-size: 11.5px; color: var(--text-3); }
/* The History view. */
.hs-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 0 22px 12px; font-size: 12px; color: var(--text-3); }
.hs-legend span { display: inline-flex; gap: 6px; align-items: center; }
.hs-legend .sp { flex: 1; }
.hs-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hs-legend .lg-left { background: var(--accent); } .hs-legend .lg-done { background: var(--done); }
.hs-legend .lg-gone { box-shadow: inset 0 0 0 1.5px #8A8A95; } .hs-legend .lg-ghost { border: 1.5px dashed #8A8A95; width: 9px; height: 9px; }
.hs-legend .d { color: var(--del-ink); }
.hist { display: grid; padding: 0 22px 64px; container-type: inline-size; }
.hs-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 18px 44px; align-items: center; column-gap: 14px; border-radius: 8px; transition: background-color var(--fast) var(--ease); }
.hs-row:hover { background: var(--hover-soft); }
.hs-row.in { background: var(--accent-soft); }
.hs-row.old-head, .hs-row:has(> .hs-flag) { grid-template-columns: minmax(0, 1fr); }
.hs-main { appearance: none; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr 1fr; column-gap: 12px; align-items: center; min-width: 0; height: 56px; padding: 0; border: 0; background: none; color: var(--text); font: 400 13.5px/1.3 var(--ui); text-align: left; cursor: pointer; }
.hs-main > .lanes { grid-row: 1 / span 2; align-self: stretch; }
.hs-main:disabled { cursor: default; }
.hs-s { align-self: end; padding-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-m { align-self: start; padding-top: 3px; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-row.gone .hs-s, .hs-row.old-head .hs-s { color: var(--text-3); }
/* A commit's tags, on one line: a merge's button, its reviews, then its chains. Those that don't
   fit wrap out of sight, whole, from the last. */
.hs-x { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; max-width: min(520px, 48cqw); height: 24px; overflow: hidden; }
.hs-chip { appearance: none; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border: 0; border-radius: 999px; background: var(--raised); color: var(--text-2); font: 500 11.5px/1 var(--code); white-space: nowrap; cursor: pointer; }
.hs-chip:hover { background: var(--hover); color: var(--text); }
.hs-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.hs-chip i.ok { background: var(--done); }
.hs-chip em { font: 500 11px/1 var(--ui); font-style: normal; color: var(--text-3); }
.hs-rev { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 22px; padding: 0 8px 0 3px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(92, 157, 248, .45); color: var(--gh); font: 600 11px/1 var(--ui); white-space: nowrap; text-decoration: none; }
/* Wider than the row's tags on its own, a review's words end in an ellipsis. */
.hs-rev span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hs-rev img { width: 16px; height: 16px; border-radius: 50%; }
.hs-rev.ok { box-shadow: inset 0 0 0 1px rgba(88, 197, 151, .5); color: var(--done); }
.hs-rev.bad { box-shadow: inset 0 0 0 1px rgba(255, 155, 149, .5); color: var(--del-ink); }
.hs-ci { display: grid; place-items: center; color: var(--text-3); }
.hs-ci svg { width: 13px; height: 13px; }
.hs-ci.ok { color: var(--done); } .hs-ci.bad { color: var(--del-ink); } .hs-ci.wait { color: var(--text-3); }
.hs-n { justify-self: end; padding-right: 10px; font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.hs-n.left { color: var(--accent-ink); }
.hs-sub { display: flex; align-items: center; gap: 10px; height: 30px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.hs-sub-s { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.hs-start { padding: 12px 0 0; font-size: 12px; color: var(--text-3); }
/* A commit's details, under its row, the row and them as one card. */
.hs-row.open { background: var(--raised); border-radius: 8px 8px 0 0; }
.hs-row.open.in { background: var(--accent-soft); }
.hs-detail { display: grid; grid-template-columns: auto minmax(0, 1fr); margin-bottom: 8px; border-radius: 0 0 8px 8px; background: var(--raised); }
/* In a chain, the card opens on its own under the commit's message. */
.hs-detail.solo { position: sticky; left: 0; grid-template-columns: minmax(0, 1fr); max-width: min(1100px, calc(100% - 44px)); margin: 0 22px 14px; border-radius: 8px; }
.hs-detail.solo .hd-in { border-top: 0; }
.hs-detail.solo .hd-info { padding-left: 18px; }
.lanes-v { position: relative; align-self: stretch; }
.lanes-v i { position: absolute; top: 0; bottom: 0; width: 1.5px; margin-left: -.75px; background: #4A4A55; }
.lanes-v i.side { background: #6F6F7A; }
.lanes-v i.ghost { background: repeating-linear-gradient(#6F6F7A 0 3px, transparent 3px 6px); }
.hd-in > .peek { grid-column: 1 / -1; position: relative; left: auto; width: auto; min-width: 0; margin: 8px 12px 16px 0; }
.hd-in > .ghost { grid-column: 1 / -1; }
.hd-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; border-top: 1px solid var(--hair); }
.hd-info { display: grid; align-content: start; gap: 14px; max-height: 380px; overflow: auto; padding: 14px 18px 16px 2px; border-right: 1px solid var(--hair); }
.hd-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 0; font-size: 12.5px; line-height: 1.45; }
.hd-facts dt { color: var(--text-3); }
.hd-facts dd { margin: 0; min-width: 0; color: var(--text); overflow-wrap: anywhere; }
.hd-facts code { font-size: 11.5px; }
.hd-facts a { text-decoration: none; } .hd-facts a:hover { text-decoration: underline; }
.hd-facts .linkish code { color: var(--gh); }
.hd-facts .linkish { text-decoration: none; } .hd-facts .linkish:hover code { text-decoration: underline; }
.hd-msg { display: grid; gap: 8px; font-size: 13px; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
.hd-subj { font-weight: 600; }
.hd-text { white-space: pre-wrap; color: var(--text-2); }
.hd-msg a { color: var(--gh); text-decoration: none; } .hd-msg a:hover { text-decoration: underline; }
.hd-msg code { font-size: 12px; color: var(--text); background: var(--hover); border-radius: 4px; padding: 0 4px; }
.hd-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.hd-acts .btn:not(.primary) { background: var(--hover); }
.hd-acts .btn:not(.primary):hover { background: var(--hair-2); }
.hd-acts .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.hd-acts .btn svg { width: 13px; height: 13px; }
.hd-none { font-size: 12.5px; color: var(--text-3); }
.hd-files { min-width: 0; max-height: 380px; overflow: auto; padding: 8px 8px 12px; }
.hd-fh { padding: 4px 8px 8px; font-size: 12px; color: var(--text-3); }
.hd-fh code { font-size: 11px; }
.hd-files .sb-row { height: 26px; }
.hd-files .sb-row:hover { background: var(--hover); }
.hd-files .sb-row.away .nm, .hd-files .sb-row.away .cnt { color: var(--text-4); }
.hd-files .sb-row.s-a:not(.away) .nm { color: var(--add-ink); }
.hd-files .sb-row.s-d .nm { text-decoration: line-through; text-decoration-color: var(--text-4); }
.hd-files .sb-row.s-d:not(.away) .nm { color: var(--del-ink); }
.hd-files .sb-row .cnt { gap: 6px; font-size: 11.5px; }
.hd-files .nm { display: flex; min-width: 0; }
.hd-files .nm > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A file's name stays whole: its folders give way first, a rename's old name before them. */
.hd-files .nm .own { flex: 0 1 auto; }
.hd-files .nm .fn { flex: none; max-width: 100%; }
.hd-files .nm .sn { flex: 0 1000 auto; margin-left: 8px; }
.hd-files .sb-row.gen .nm { color: var(--text-2); }
.hd-more { padding: 6px 8px; font-size: 12px; color: var(--text-3); }
.hd-rail { display: grid; align-content: start; gap: 2px; padding: 8px 6px; }
.hd-rail .ib { width: 26px; height: 26px; color: var(--text-3); }
.hd-rail .ib:hover, .hd-rail .ib[aria-pressed="true"] { background: var(--hover); color: var(--text); }
@container (max-width: 640px) { .hd-in { grid-template-columns: minmax(0, 1fr) auto; } .hd-info { border-right: 0; } .hd-files { grid-column: 1; grid-row: 2; border-top: 1px solid var(--hair); } .hd-rail { grid-column: 2; grid-row: 1 / span 2; } }
@container (max-width: 760px) { .hs-chip { display: none; } }
@container (max-width: 520px) { .hs-x { display: none; } }

/* ---- Sections of a view: a member in a chain, a test, a symbol. Their counts and actions show on hover. */
.sec { padding-bottom: 10px; }
.sec-h { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; max-width: 100%; padding: 16px 22px 8px; font-size: 12.5px; color: var(--text-3); }
.sec-h b { font: 600 13px/1.3 var(--code); color: var(--text); }
.sec-h .sp { flex: 1; }
.sec-h code { color: var(--text-2); }
.hov { display: inline-flex; align-items: center; gap: 10px; opacity: 0; transition: opacity var(--fast) var(--ease); }
.sec-h:hover .hov, .sec-h:focus-within .hov, .sym-h:hover .hov, .sym-h:focus-within .hov { opacity: 1; }
.sec-h.sub { padding: 10px 22px 4px; }
.sec-h.sub > span:first-child { color: var(--text-2); }
.sec-note { position: sticky; left: 0; max-width: min(760px, 100%); padding: 0 22px 8px; font-size: 12.5px; color: var(--text-3); }
.sec-file, .inst-file { position: sticky; left: 0; padding: 8px 22px 2px; font: 500 12px/1.4 var(--code); color: var(--text-3); }
.sec-file .linkish, .inst-file .linkish { color: var(--text-2); text-decoration-color: transparent; }
.sec-file .linkish:hover, .inst-file .linkish:hover { color: var(--text); text-decoration-color: var(--text-3); }
/* Tests as sentences: a test file's group and test calls, nested as the code nests them, each its
   title. A new call reads bright with a green plus, a rewording marks the words that changed, and
   the groups that didn't change are dimmed, so a new then still reads as its whole sentence. */
.ol-sect { position: sticky; left: 0; padding: 22px 22px 0; font: 600 11px/1.3 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.sec.ol-sec { padding-bottom: 6px; }
/* A file's mark sits where its rows' marks do. */
.ol-file { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 16px 18px 6px 22px; }
.ol-file .nm { font: 600 13px/1.4 var(--code); color: var(--text); text-decoration-color: transparent; }
.ol-file .nm:hover { text-decoration-color: var(--text-3); }
.ol-file .dir { min-width: 0; font: 400 11.5px/1.4 var(--code); color: var(--text-4); overflow-wrap: anywhere; }
.ol-file .sp { flex: 1; }
.ol-file .n { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.ol-file.fold { margin: 0 10px; padding: 7px 8px 7px 12px; border-radius: 7px; cursor: pointer; }
.ol-file.fold:hover { background: var(--row-hover); }
.ol-file.fold .nm { font-weight: 500; color: var(--text-2); }
.ol-file.fold.open .nm { color: var(--text); }
.ol-file .car, .ol-fold .car { display: inline-grid; place-items: center; width: 12px; color: var(--text-3); }
.ol-file .car svg, .ol-fold .car svg { width: 12px; height: 12px; }
.ol-row {
  position: sticky; left: 0; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline;
  margin: 0 10px; padding: 4px 8px 4px calc(12px + var(--d) * var(--ol-step, 20px)); border-radius: 7px; cursor: pointer; outline: none;
  background-image: repeating-linear-gradient(90deg, transparent 0 calc(var(--ol-step, 20px) - 2px), var(--hair) calc(var(--ol-step, 20px) - 2px) calc(var(--ol-step, 20px) - 1px), transparent calc(var(--ol-step, 20px) - 1px) var(--ol-step, 20px));
  background-size: calc(var(--d) * var(--ol-step, 20px)) 100%; background-repeat: no-repeat;
  transition: background-color var(--fast) var(--ease);
}
.ol-row:hover, .ol-row:focus-visible { background-color: var(--row-hover); }
.ol-row:focus-visible { box-shadow: inset 0 0 0 1px var(--hair-2); }
.ol-row.open { background-color: var(--raised); }
.ol-mk { font: 700 12px/1.55 var(--code); text-align: center; color: var(--text-4); user-select: none; }
.ol-row.new .ol-mk { color: var(--add-ink); }
.ol-row.rew .ol-mk { color: var(--accent); }
.ol-row.reg .ol-mk { color: var(--text-2); }
.ol-row.del .ol-mk { color: var(--del-ink); }
.ol-tt { min-width: 0; font: 400 13.5px/1.5 var(--ui); color: var(--text); text-wrap: pretty; overflow-wrap: anywhere; }
.ol-tt .kw { font-weight: 600; color: var(--text-2); }
.ol-row.ctx .ol-tt, .ol-row.ctx .ol-tt .kw { color: var(--text-3); }
.ol-row.lbl .ol-tt { font: 500 12px/1.6 var(--code); color: var(--text-3); }
.ol-row.done .ol-tt, .ol-row.done .ol-tt .kw { color: var(--text-3); }
.ol-row.del .ol-tt { color: var(--text-3); text-decoration: line-through; text-decoration-color: rgba(255, 155, 149, .55); }
.ol-row.del.sub { cursor: default; }
.ol-row.del.sub:hover { background-color: transparent; }
.ol-tt ins { text-decoration: none; background: var(--add-strong); color: var(--text); border-radius: 3px; padding: 0 2px; }
.ol-tt del { color: var(--del-ink); text-decoration: line-through; opacity: .75; }
.ol-row.sent { padding-top: 6px; padding-bottom: 6px; }
.ol-row.sent .ol-tt .g, .ol-row.sent .ol-tt .g .kw { color: var(--text-3); }
.ol-row.sent .ol-tt .g.gnew { color: var(--text-2); }
.ol-lbl { position: sticky; left: 0; padding: 8px 22px 2px 46px; font: 500 11.5px/1.4 var(--code); color: var(--text-3); }
.ol-meta { display: inline-flex; align-items: center; gap: 6px; align-self: center; }
.ol-tag { font: 500 11px/1 var(--ui); color: var(--text-3); background: var(--raised); border-radius: 999px; padding: 4px 8px; white-space: nowrap; }
.ol-row.open .ol-tag { background: var(--hover); }
.ol-chip { appearance: none; border: 0; background: none; max-width: 24ch; padding: 3px 7px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--hair-2); color: var(--text-3); font: 500 11px/1 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.ol-chip code { font: 500 11px/1 var(--code); color: var(--text-2); }
.ol-chip:hover { color: var(--text-2); box-shadow: inset 0 0 0 1px var(--text-3); }
.ol-go { appearance: none; border: 0; background: none; display: grid; place-items: center; flex: none; width: 24px; height: 24px; padding: 0; border-radius: 6px; color: var(--text-3); cursor: pointer; opacity: 0; transition: opacity var(--fast) var(--ease); }
/* Codicons are drawn on a 16-pixel grid: any smaller and their thin strokes break up. */
.ol-go svg { width: 16px; height: 16px; }
.ol-row:hover .ol-go, .ol-row:focus-within .ol-go, .ol-row.open .ol-go { opacity: 1; }
.ol-go:hover { background: var(--hair-2); color: var(--text); }
.ol-go-sp { width: 24px; flex: none; }
/* A row's expect calls and lines wait for the pointer; their room is kept, so nothing moves. */
.ol-df, .ol-xp { white-space: nowrap; opacity: 0; transition: opacity var(--fast) var(--ease); }
.ol-df { font: 500 11.5px/1 var(--code); }
.ol-xp { font: 500 11px/1 var(--ui); color: var(--text-4); }
.ol-row:hover .ol-df, .ol-row:focus-within .ol-df, .ol-row.open .ol-df, .ol-row:hover .ol-xp, .ol-row:focus-within .ol-xp, .ol-row.open .ol-xp { opacity: 1; }
/* The commit that wrote a test, in the Tests view: with the row's other details, on hover. They all
   come before its tags, so the tags line up beside the mark, row after row. */
.ol-chip.ol-hov { opacity: 0; transition: opacity var(--fast) var(--ease); }
.ol-row:hover .ol-chip.ol-hov, .ol-row:focus-within .ol-chip.ol-hov, .ol-row.open .ol-chip.ol-hov { opacity: 1; }
/* Or on every row, as ⋯ says: a touch screen's way, with nothing to hover. */
.vw.ol-all :is(.ol-go, .ol-df, .ol-xp, .ol-chip.ol-hov) { opacity: 1; }
.ol-nosu { display: inline-block; width: 6px; height: 6px; margin-left: 7px; border-radius: 50%; background: var(--del-ink); vertical-align: 2px; }
.ol-row.ctx .ol-nosu, .ol-row.done .ol-nosu, .ol-row.sent .g .ol-nosu { opacity: .7; }
.ol-tick-sp { width: 14px; }
.ol-row:hover .tick:not(.on) { box-shadow: inset 0 0 0 1.5px var(--accent); }
.ol-row:hover .tick.on::after { border-color: var(--done); }
.ol-row.flash { animation: olflash 1.2s var(--ease) 1; }
@keyframes olflash { 0% { box-shadow: inset 3px 0 0 var(--accent); background-color: var(--accent-soft); } 100% { box-shadow: inset 3px 0 0 transparent; } }
.ol-fold { position: sticky; left: 0; margin: 0 10px; padding: 3px 8px 3px calc(12px + var(--d) * var(--ol-step, 20px) + 24px); border-radius: 7px; font-size: 12.5px; color: var(--text-3); cursor: pointer; }
.ol-fold:hover { background: var(--row-hover); color: var(--text-2); }
/* Reviewed rows folded to a line: its check sits where the rows' marks do. */
.ol-fold.ok .ok-ic, .ol-file .ok-ic { display: inline-grid; place-items: center; color: var(--done); }
.ol-fold.ok .ok-ic { width: 14px; margin: 0 10px 0 -24px; vertical-align: -1px; }
.ol-file .ok-ic { margin-right: 5px; vertical-align: -1px; }
.ol-fold.ok svg, .ol-file .ok-ic svg { width: 12px; height: 12px; }
.ol-file.ck .car { appearance: none; align-self: center; height: 18px; margin: 0 -4px 0 -18px; padding: 0; border: 0; border-radius: 4px; background: none; cursor: pointer; }
.ol-file.ck .car:hover { background: var(--hover); color: var(--text); }
.ol-file .tick, .ol-file .ol-tick-sp { align-self: center; }
.ol-file.done .nm { color: var(--text-3); }
.ghost .ol-tt, .ghost .ol-tt .kw { transition: color var(--med) var(--ease); }
.ghost.settle .ol-tt, .ghost.settle .ol-tt .kw { color: var(--text-3); }
.ol-fold.cf { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-left: 20px; color: var(--text-2); }
.ol-fold.cf code { font: 500 11.5px/1 var(--code); color: var(--text-2); }
.code.ol-code { position: sticky; left: 0; width: auto; min-width: 0; margin: 2px 12px 10px calc(22px + var(--d) * var(--ol-step, 20px) + 22px); padding: 4px 0; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--hair); overflow-x: auto; }
.ol-code > .ln, .ol-code > .sl { width: max-content; min-width: 100%; }
.ln.ol-ph .tx { font: 400 12.5px/var(--row) var(--ui); color: var(--text-3); white-space: normal; }
.ln.ol-ph .ol-ph-t .kw { font-weight: 600; }
.ln.ol-ph .ol-ph-n { margin-left: 10px; font-size: 11px; color: var(--text-4); }
.ol-out { padding-bottom: 6px; }
.ol-bar { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 0 22px 12px; }
.ol-bar .sp { flex: 1; }
/* The groups of the line at the top of the view, once their own lines have scrolled away. */
.ol-pinw { position: sticky; top: var(--hh, 52px); left: 0; z-index: 4; height: 0; }
.ol-pin { display: none; padding: 6px 22px 7px 34px; background: rgba(18, 18, 21, .97); box-shadow: 0 1px 0 var(--hair), 0 8px 16px -10px rgba(0, 0, 0, .8); }
.ol-pin.on { display: grid; gap: 1px; }
.ol-pin-l { padding-left: calc(var(--d) * 18px); font: 400 12.5px/1.45 var(--ui); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-pin-l .kw { font-weight: 600; }
.ol-pin-l.lbl { font: 500 11.5px/1.45 var(--code); color: var(--text-3); }
.inst-gap { height: 10px; }
.sym-h { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 16px 22px 6px; font-size: 12.5px; color: var(--text-3); }
.sym-h b { color: var(--text); }
.sym-h .sp { flex: 1; }
.more-row { position: sticky; left: 0; padding: 6px 22px 12px; font-size: 12.5px; color: var(--text-3); }
.ctx-row .linkish { color: var(--text-2); }
.gen-tag { font: 500 11px/1 var(--ui); color: var(--text-3); background: var(--raised); border-radius: 4px; padding: 2px 6px; margin-left: 6px; }
div.empty { position: sticky; left: 0; max-width: 700px; padding: 28px 22px; color: var(--text-3); font-size: 13.5px; }
/* A member reached from the graph: its header tinted, held a moment, then fading. */
.flash-sec .sec-h { animation: flashsec 1.8s var(--ease) 1; }
@keyframes flashsec { 0%, 30% { background: rgba(233, 180, 76, .2); box-shadow: inset 3px 0 0 var(--accent); } 100% { background: transparent; box-shadow: inset 3px 0 0 transparent; } }

/* ---- Code. A whole file has thousands of rows: the ones off screen skip layout and paint until
   scrolled to. That clips what overflows a row, so focus rings inside rows are drawn inward. A
   block of rows off screen skips them all, so a scroll checks the blocks (a long one is cut into
   blocks of a hundred rows), not every row of the view; until it's first drawn, it's a row tall
   for each thing it holds (--rows, set as it's drawn). */
.code { font: 400 12.5px/1.65 var(--code); width: max-content; min-width: 100%; }
.vw-main .code { content-visibility: auto; contain-intrinsic-width: auto 0px; contain-intrinsic-height: auto calc(var(--rows, 40) * 20.625px); }
.ln { display: flex; align-items: flex-start; }
.code > .ln, .code > .sl { content-visibility: auto; contain-intrinsic-size: auto 20.625px; }
/* A test's code is short, and opens under its sentence: it shows on its first frame. */
.vw-main .code.ol-code, .code.ol-code > .ln, .code.ol-code > .sl { content-visibility: visible; }
.code > .ln :focus-visible, .code > .sl :focus-visible { outline-offset: -2px; }
.ln .g, .sl .g { display: flex; align-items: center; justify-content: center; width: var(--gut); height: var(--row); flex: none; background: var(--sheet); }
/* Scrolled sideways, the gutter stays at the left edge, over the code. Only then: a gutter stuck
   on every row costs every frame of a scroll. */
.vw-main.aside .ln .g, .vw-main.aside .sl .g { position: sticky; left: 0; z-index: 1; }
.ln .no, .half .no { width: var(--num); flex: none; padding-right: 10px; text-align: right; color: var(--text-4); user-select: none; font-variant-numeric: tabular-nums; }
.ln .no.wide { width: 60px; }
.ln .no .linkish { text-decoration: none; }
.ln .no .linkish:hover { color: var(--text); text-decoration: underline; }
.ln .sg, .half .sg { width: var(--sign); flex: none; color: var(--text-3); user-select: none; }
.ln .tx { flex: none; padding-right: 16px; white-space: pre; }
.ln.add, .half.add, .ln.add .g { background: var(--add); }
.ln.del, .half.del, .ln.del .g { background: var(--del); }
.ln.add .no, .half.add .no { color: var(--add-no); }
.ln.del .no, .half.del .no { color: var(--del-no); }
.ln.add .sg, .half.add .sg { color: var(--add-ink); }
.ln.del .sg, .half.del .sg { color: var(--del-ink); }
.add .ch { background: var(--add-strong); border-radius: 2px; }
.del .ch { background: var(--del-strong); border-radius: 2px; }
/* A reviewed part of a line that still has changes to review. */
.rv { text-decoration: underline dotted var(--done); text-underline-offset: 3px; }
/* Reviewed code settles: its diff shown faint, or (by default) read as quiet context. */
.ln.rvd > :not(.g), .sl.rvd > .half { opacity: .55; }
.ln.rvd-quiet > :not(.g), .sl.rvd-quiet > .half { opacity: .58; }
.ln.gone { align-items: center; }
.ln.gone .tx, .sl.gone .tx { font: 400 12px/var(--row) var(--ui); color: var(--text-3); }
.ln.other .g, .sl.other .g { box-shadow: inset 2px 0 0 var(--hair-2); }
.ln.mv, .ln.mv .g, .ln.mv-head, .ln.mv-head .g, .ln.mv-away, .ln.mv-away .g { background: var(--mv); }
.ln.mv .sg, .ln.mv-head .sg, .ln.mv-away .sg { color: var(--mv-ink); }
.ln.mv-head .tx, .ln.mv-away .tx { font: 400 12.5px/var(--row) var(--ui); color: var(--text-2); }
.ln.skip { color: var(--text-3); }
.ln.skip .tx { font: 400 12px/var(--row) var(--ui); }
.ln.skip.mv .tx { color: var(--mv-ink); }
.ln.gen .g { width: 8px; }
.code.src .ln.add .sg, .code.src .ln.del .sg { font-weight: 700; }
.ln:hover, .ln:hover .g { background-color: var(--row-hover); }
.ln.add:hover, .ln.add:hover .g { background-color: var(--add); }
.ln.del:hover, .ln.del:hover .g { background-color: var(--del); }
.ln.mv:hover, .ln.mv:hover .g { background-color: var(--mv); }
/* A line's badges, at its end: the same change elsewhere, changed usages, a reviewed change's
   diff. (Not .note: that's the review's notes, which aren't buttons.) */
.bdgs { display: inline-flex; align-items: center; gap: 12px; flex: none; height: var(--row); padding-right: 16px; }
.bdg { appearance: none; border: 0; background: none; padding: 0; font: 500 11px/1.2 var(--ui); color: var(--text-3); white-space: nowrap; cursor: pointer; border-bottom: 1px dotted var(--text-4); }
.bdg:hover { color: var(--text); border-bottom-color: var(--text-2); }
.bdg.ok { color: var(--text-4); }
/* The review mark: muted until the pointer is on its line. */
.tick { appearance: none; position: relative; width: 14px; height: 14px; margin: 0; padding: 0; border: 0; border-radius: 4px; background: transparent; box-shadow: inset 0 0 0 1.5px #3A3A44; color: transparent; font-size: 0; cursor: pointer; transition: background-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
.tick::after { content: ""; position: absolute; left: 5px; top: 2.2px; width: 3.4px; height: 7px; border: solid transparent; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); transition: border-color var(--fast) var(--ease); }
.ln:hover .tick, .sl:hover .tick, .tick:focus-visible { box-shadow: inset 0 0 0 1.5px var(--accent); }
.tick:hover { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tick:hover::after { border-color: var(--accent); }
/* Part of what it covers reviewed: a dash. */
.tick.part::after { left: 3.5px; top: 5.6px; width: 7px; height: 0; border-width: 0 0 1.6px 0; border-color: rgba(88, 197, 151, .7); transform: none; }
.tick.on { box-shadow: none; }
.tick.on::after { border-color: rgba(88, 197, 151, .5); }
.ln:hover .tick.on::after, .sl:hover .tick.on::after { border-color: var(--done); }
.tick.on:hover { background: var(--done); box-shadow: none; }
.tick.on:hover::after { border-color: var(--ground); }
.ln.flash .g, .sl.flash .g { animation: flash 1.2s var(--ease) 1; }
@keyframes flash { 0% { box-shadow: inset 3px 0 0 var(--accent); } 100% { box-shadow: inset 3px 0 0 transparent; } }
/* Where a jump lands (Go to it in this diff, a line shown in its file): the whole line tinted, held
   a moment, then fading. The next change, glided to, keeps the gutter's mark above. */
.ln.arrive, .sl.arrive { position: relative; }
.ln.arrive::after, .sl.arrive::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; background: rgba(233, 180, 76, .2); box-shadow: inset 3px 0 0 var(--accent), inset 0 0 0 1px rgba(233, 180, 76, .55); animation: arrive 1.8s var(--ease) 1; }
@keyframes arrive { 0%, 30% { opacity: 1; } 100% { opacity: 0; } }
.t-kw { color: var(--syn-kw); } .t-ty { color: var(--syn-ty); } .t-str { color: var(--syn-str); } .t-num { color: var(--syn-num); }
.t-com { color: var(--syn-com); font-style: italic; } .t-ann { color: var(--syn-ann); } .t-op { color: var(--syn-op); } .t-key { color: var(--syn-id); }
.t-id { color: var(--syn-id); } .t-fn { color: var(--syn-fn); } .t-md { color: var(--text); }
.ref { cursor: pointer; border-radius: 2px; }
.ref:hover { text-decoration: underline; text-decoration-color: currentColor; text-underline-offset: 3px; background: rgba(255, 255, 255, .08); }

/* A hunk's divider: its first line and context, in grey. Expanding the lines around it and
   marking it reviewed show under the pointer. */
.hh { position: relative; display: flex; align-items: center; height: 30px; margin-top: 6px; background: var(--sheet); color: var(--text-3); font-size: 12px; transition: background-color var(--fast) var(--ease); }
.hh.joined { margin-top: 0; }
.hh.more { cursor: pointer; }
.hh:hover { background: var(--hover-soft); }
.hh-g { position: sticky; left: 0; z-index: 1; display: flex; justify-content: center; width: var(--gut); flex: none; background: inherit; }
.hh-at { width: var(--num); flex: none; padding-right: 10px; text-align: right; font: 500 11.5px/1 var(--ui); color: var(--text-3); font-variant-numeric: tabular-nums; }
.hh-tx { padding-left: var(--sign); font: 400 12px/1 var(--code); color: var(--text-3); white-space: pre; }
.hh-tail .hh-tx, .hh-tx.ui { font: 500 11.5px/1 var(--ui); }
.hh-sum { display: inline-flex; align-items: center; gap: 6px; margin-left: 14px; font: 500 11.5px/1 var(--ui); color: var(--text-3); white-space: nowrap; }
.hh-sum.ok { color: var(--done); }
.hh-sum svg { width: 12px; height: 12px; }
.hh-sum .cm-cnt { margin-left: 4px; }
.hh-chips { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }
.hh-chips .chip-btn { height: 22px; font-size: 11.5px; }
.hh > .sp { flex: 1; min-width: 24px; }
.hh-x { position: sticky; right: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; background: inherit; opacity: 0; transition: opacity var(--fast) var(--ease); }
.hh:hover .hh-x, .hh:focus-within .hh-x { opacity: 1; }
.mo { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px 0 7px; border-radius: 999px; background: var(--raised); color: var(--text-2); font: 500 11.5px/1 var(--ui); white-space: nowrap; cursor: pointer; }
.mo:hover { background: var(--hover); color: var(--text); }
.mo svg { width: 12px; height: 12px; }
.chev { appearance: none; display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--text-3); cursor: pointer; }
.chev:hover { background: var(--hover); color: var(--text); }
.chev svg { width: 14px; height: 14px; }

/* Side by side. */
.vw.split .code { width: 100%; }
.sl { display: flex; align-items: stretch; }
.half { flex: 1 1 0; min-width: 0; display: flex; align-items: flex-start; }
.half.l { box-shadow: inset -1px 0 0 var(--hair); }
.half .tx { flex: 1 1 auto; min-width: 0; padding-right: 10px; white-space: pre-wrap; word-break: break-all; }
.half.empty { background: repeating-linear-gradient(135deg, #16161A 0 6px, var(--sheet) 6px 12px); }
.sl:hover .half.ctx, .sl:hover .g { background-color: var(--row-hover); }

/* ---- A peek: a definition, or changed usages, under the line it was asked from. */
.peek { position: sticky; left: var(--text-x); z-index: 2; width: min(860px, calc(100cqw - var(--text-x) - 24px)); margin: 6px 0 10px var(--text-x); border-radius: 10px; background: var(--raised); box-shadow: var(--float); overflow: hidden; font-family: var(--ui); white-space: normal; }
.pk-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 12px 8px 14px; font-size: 12.5px; color: var(--text-2); }
.pk-h b { color: var(--text); font-weight: 600; }
.pk-h .sp { flex: 1; }
.pk-h2 { box-shadow: inset 0 1px 0 var(--hair); padding-top: 10px; }
.pk-loc { font: 500 12px/1.4 var(--code); color: var(--text-2); overflow-wrap: anywhere; }
.pk-src { font-size: 12px; color: var(--text-3); }
.pk-x { appearance: none; border: 0; background: none; color: var(--text-3); font: 500 12px/1 var(--ui); cursor: pointer; padding: 6px 4px; }
.pk-x:hover { color: var(--text); }
.pk-code { max-height: min(360px, 45vh); overflow: auto; overscroll-behavior: contain; padding: 2px 0 8px; font: 400 12px/1.6 var(--code); }
/* A commit's test file, as its outline (History). */
.pk-ol { max-height: min(520px, 60vh); overflow: auto; overscroll-behavior: contain; padding: 2px 0 8px; }
/* While its code is on its way, a peek is as tall as it will be: it opens once and fills in place. */
.pk-code.pk-tall, .pk-wait { height: min(360px, 45vh); }
.pk-wait { display: flex; flex-direction: column; gap: 11px; padding: 12px 14px 0 70px; overflow: hidden; }
.pk-wait.pk-few { height: auto; padding-bottom: 14px; }
.pk-sk { display: block; flex: none; height: 8px; width: 46%; border-radius: 4px; background: linear-gradient(90deg, var(--hover) 25%, var(--hair-2) 50%, var(--hover) 75%) 0 0 / 300% 100%; animation: pksk 1.4s linear infinite; }
.pk-sk:nth-child(3n + 1) { width: 62%; }
.pk-sk:nth-child(4n + 2) { width: 34%; margin-left: 24px; }
.pk-sk:nth-child(5n) { width: 52%; margin-left: 24px; }

.pk-ln { display: flex; white-space: pre; }
.pk-ln .no { width: 46px; flex: none; padding-right: 10px; text-align: right; color: var(--text-4); }
/* Prose wraps within the available column, including long links, without adding line numbers. */
.code:has(> .ln.md) { width: 100%; }
.ln.md { width: 100%; max-width: 100cqw; }
.ln.md > .tx, .pk-ln.md > .tx { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.half.md > .tx { word-break: normal; overflow-wrap: anywhere; }

.pk-ln.hit.flash { animation: flashpk 1.1s var(--ease) 1; }
@keyframes flashpk { 0% { background: rgba(233, 180, 76, .2); } 100% { background: rgba(255, 255, 255, .05); } }
/* A name asked about from inside a peek, while the language server answers. */
.ref.asking { cursor: progress; text-decoration: underline dotted; text-underline-offset: 3px; }
/* An import's URI is one link over its string's tokens: each underlines itself, in its own color. */
.ref.uri:hover, .ref.uri.asking { text-decoration: none; }
.ref.uri:hover > span { text-decoration: underline; text-decoration-color: currentColor; text-underline-offset: 3px; }
.ref.uri.asking > span { text-decoration: underline dotted; text-underline-offset: 3px; }
.pk-ln.add { background: var(--add); }
/* A move's lines, in the peek of its other copy: tinted as moved lines are. */
.pk-ln.mvr { background: var(--mv); }
.pk-ln.mvr.hit { background: linear-gradient(rgba(255, 255, 255, .05), rgba(255, 255, 255, .05)), var(--mv); }
.pk-ln.add.hit { background: linear-gradient(rgba(255, 255, 255, .05), rgba(255, 255, 255, .05)), var(--add); }
.pk-ln.del { background: var(--del); }
.pk-ln.del.hit { background: linear-gradient(rgba(255, 255, 255, .05), rgba(255, 255, 255, .05)), var(--del); }
.pk-ln .sg { width: 14px; flex: none; color: var(--add-ink); }
.pk-ln.del .sg { color: var(--del-ink); }
.pk-hunk { padding: 5px 14px; color: var(--text-4); white-space: pre-wrap; }
.pk-hint { font-size: 12px; color: var(--text-3); }
.pk-foot { padding: 4px 14px 12px; font-size: 12.5px; }
/* The places line up in a column as wide as the longest, up to under half the list. */
.pk-list { display: grid; grid-template-columns: fit-content(45%) minmax(0, 1fr); max-height: 240px; overflow-y: auto; padding: 0 0 6px; }
.pk-use { appearance: none; display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; gap: 12px; padding: 4px 14px; border: 0; background: none; color: var(--text); font: 400 12px/1.5 var(--code); text-align: left; cursor: pointer; }
.pk-use:hover { background: var(--hover); }
.pk-use[aria-current="true"] { background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
.pk-use .pk-up::after { content: " →"; color: transparent; }
.pk-use[aria-current="true"] .pk-up::after { color: var(--accent); }

/* The type an implementing member is in, before its line. */

.pk-use .pk-in::after { content: " › "; color: var(--text-3); }
.pk-use.done { opacity: .55; }

/* ---- GitHub: threads under their lines, writing comments, the conversation, the review. */
.cm-add { position: absolute; z-index: 3; display: none; place-items: center; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 5px; background: var(--gh); color: #06101F; font: 700 14px/1 var(--ui); cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); transition: transform var(--fast) var(--ease); }
.cm-add.on { display: grid; }
.cm-add:hover { transform: scale(1.12); }
/* The lines an open thread or note is on: a bar in the gutter, blue for GitHub and orchid for notes,
   side by side under both. Pointing at the comment or its bar tints them; a click on the bar goes to it. */
.ln.cm-on .g, .sl.cm-on .g { box-shadow: inset 2px 0 0 var(--gh); cursor: pointer; }
.ln.nt-on .g, .sl.nt-on .g { box-shadow: inset 2px 0 0 var(--local); cursor: pointer; }
.ln.cm-on.nt-on:not(.cm-sel) .g, .sl.cm-on.nt-on:not(.cm-sel) .g { box-shadow: inset 2px 0 0 var(--gh), inset 4px 0 0 var(--local); }

.ln.nt-hot, .sl.nt-hot, .ln.nt-hot .g, .sl.nt-hot .g { background-image: linear-gradient(var(--local-soft), var(--local-soft)); }
.ln.cm-sel, .sl.cm-sel, .ln.cm-drag, .sl.cm-drag, .ln.cm-sel .g, .ln.cm-drag .g, .sl.cm-sel .g, .sl.cm-drag .g { background-image: linear-gradient(var(--gh-soft), var(--gh-soft)); }
.ln.cm-sel .g, .ln.cm-drag .g, .sl.cm-sel .g, .sl.cm-drag .g { box-shadow: inset 2px 0 0 var(--gh); }
body.dragging, body.dragging * { user-select: none; cursor: grabbing; }
.th { position: sticky; left: var(--text-x); z-index: 2; width: min(820px, calc(100cqw - var(--text-x) - 24px)); margin: 6px 0 10px var(--text-x); border-radius: 10px; background: var(--raised); box-shadow: inset 2px 0 0 var(--gh); font: 400 13px/1.5 var(--ui); white-space: normal; overflow: hidden; }

@keyframes flashth { 0% { box-shadow: inset 2px 0 0 var(--gh), 0 0 0 2px var(--gh); } 100% { box-shadow: inset 2px 0 0 var(--gh), 0 0 0 2px transparent; } }
.th-fold { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 0 14px; border: 0; background: none; color: var(--text-2); font: 500 12.5px/1.3 var(--ui); text-align: left; cursor: pointer; }
.th-fold:hover { color: var(--text); }

.th-fold .tw { display: inline-grid; color: var(--text-3); }
.th.resolved .th-fold > svg { color: var(--done); }
.th-fold .muted { font-weight: 400; }
.th-note { margin: 10px 14px 0; font-size: 12px; color: var(--accent-ink); }
.th-new-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 14px 8px; font-size: 12.5px; color: var(--text-2); }
.th-new-h b { color: var(--text); font-weight: 600; }
.th-new-h svg { width: 14px; height: 14px; color: var(--gh); }
.th-new-h .muted { font-size: 12px; }
.th.new .cmp { margin: 0 12px 12px; }
/* Comments: the author once per run of them, each with its time; tools under the pointer. */
.cm { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 10px; padding: 4px 14px 6px; }
.cm.first { padding-top: 12px; }
.th > .cm:last-of-type { padding-bottom: 8px; }
.av { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #3B3B45, #24242B); flex: none; object-fit: cover; }
.cm-main { display: grid; gap: 3px; min-width: 0; }
.cm-h { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 20px; padding-right: 96px; font-size: 12.5px; color: var(--text-3); }
.cm-who { color: var(--text); font-size: 13px; font-weight: 600; text-decoration: none; }
.cm-who:hover { text-decoration: underline; text-underline-offset: 3px; }
.cm-tag { font: 500 11px/1.5 var(--ui); color: var(--text-2); background: var(--hover); border-radius: 4px; padding: 0 6px; }
.cm-tag.pending { color: var(--accent-ink); background: var(--accent-soft); }
.cm-t { position: absolute; right: 14px; top: 6px; font-size: 11.5px; color: var(--text-3); transition: opacity var(--fast) var(--ease); }
.cm.first .cm-t { display: none; }
.cm-tools { position: absolute; right: 8px; top: 3px; display: inline-flex; gap: 1px; padding: 2px; border-radius: 8px; background: var(--raised); box-shadow: 0 0 0 1px var(--hair); opacity: 0; transition: opacity var(--fast) var(--ease); }
.cm.first .cm-tools { top: 9px; }
.cm:hover .cm-tools, .cm-tools:focus-within { opacity: 1; }
.cm:hover .cm-t { opacity: 0; }
.cm-tools .ib { width: 26px; height: 24px; }
.cm-tools .ib svg { width: 14px; height: 14px; }
.cm-rx { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.rx { appearance: none; border: 0; border-radius: 999px; background: var(--sheet); color: var(--text-2); font: 500 12px/1.4 var(--ui); padding: 2px 8px; cursor: pointer; }
.rx:hover { background: var(--hover); }
.rx.on { background: var(--gh-soft); color: var(--text); box-shadow: inset 0 0 0 1px rgba(92, 157, 248, .35); }
.rx-pick { display: inline-flex; gap: 2px; padding: 2px 4px; border-radius: 999px; background: var(--sheet); box-shadow: inset 0 0 0 1px var(--hair); }

.rx-pick .rx.on { background: var(--gh-soft); }
.th-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 12px 12px 44px; }

.th-f > .btn { margin-left: auto; }
.th-reply { appearance: none; flex: 1 1 200px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--sheet); color: var(--text-3); font: 400 12.5px/1 var(--ui); text-align: left; cursor: text; }
.th-reply:hover { color: var(--text-2); }
.th-f .cmp-err { flex: 1 1 100%; padding: 0; }
.cm-body { color: var(--text); font: 400 13.5px/1.55 var(--ui); overflow-wrap: anywhere; }

.cm-body > :last-child { margin-bottom: 0; }
.cm-body p, .cm-body ul, .cm-body ol, .cm-body pre, .cm-body blockquote, .cm-body table, .cm-body details, .cm-body .highlight { margin: 0 0 8px; }
.cm-body ul, .cm-body ol { padding-left: 22px; }
.cm-body h1, .cm-body h2, .cm-body h3, .cm-body h4, .cm-body h5, .cm-body h6 { font-size: 14.5px; margin: 12px 0 6px; }
.cm-body a { color: var(--gh); text-decoration: none; }
.cm-body a:hover { text-decoration: underline; }
.cm-body code { font: 12.5px var(--code); background: var(--sheet); padding: .15em .4em; border-radius: 5px; }
.cm-body pre { font: 12.5px/1.5 var(--code); background: var(--ground); border-radius: 8px; padding: 10px 12px; overflow: auto; white-space: pre; }
.cm-body pre code { background: none; padding: 0; font-size: inherit; }
.cm-body blockquote { padding: 0 12px; box-shadow: inset 2px 0 0 var(--hair-2); color: var(--text-2); }
.cm-body img { max-width: 100%; height: auto; }
.cm-body table { border-collapse: collapse; display: block; overflow: auto; }
.cm-body td, .cm-body th { border: 1px solid var(--hair-2); padding: 5px 10px; }
.cm-body hr { border: 0; border-top: 1px solid var(--hair-2); }
.cm-body .user-mention, .cm-body .team-mention { font-weight: 600; color: var(--text); }
.cm-body .task-list-item { list-style: none; }
.cm-body .contains-task-list { padding-left: 6px; }
.cm-body input[type="checkbox"] { margin: 0 6px 0 0; vertical-align: middle; }
.cm-body summary { cursor: pointer; }
.cm-body .pl-k, .cm-body .pl-kos { color: var(--syn-kw); } .cm-body .pl-s, .cm-body .pl-pds { color: var(--syn-str); } .cm-body .pl-c { color: var(--syn-com); }
.cm-body .pl-en, .cm-body .pl-e { color: var(--syn-fn); } .cm-body .pl-c1, .cm-body .pl-sr { color: var(--syn-ty); } .cm-body .pl-smi, .cm-body .pl-v { color: var(--syn-id); } .cm-body .pl-ent { color: var(--add-ink); }
.cm-body .pl-mi1 { color: var(--add-ink); background: var(--add); } .cm-body .pl-md { color: var(--del-ink); background: var(--del); } .cm-body .pl-mdr, .cm-body .pl-mh { color: var(--text-3); }
/* A suggested change, as GitHub renders it. */
.cm-body .js-suggested-changes-blob { border-radius: 8px; overflow: hidden; margin: 0 0 8px; background: var(--ground); }
.cm-body .js-suggested-changes-blob > div:first-child { padding: 6px 10px; font-size: 12px; color: var(--text-3); }
.cm-body .js-suggested-changes-blob > div:nth-child(2) { overflow-x: auto; }
.cm-body .js-suggested-changes-blob table { display: table; width: 100%; border-collapse: collapse; font: 12.5px/1.55 var(--code); margin: 0; }
.cm-body .js-suggested-changes-blob td { border: 0; padding: 0 8px; white-space: pre; }
.cm-body .blob-num { width: 1%; text-align: right; color: var(--text-3); user-select: none; }
.cm-body .blob-num::before { content: attr(data-line-number); }
.cm-body .blob-num-deletion, .cm-body .blob-code-deletion { background: var(--del); }
.cm-body .blob-num-addition, .cm-body .blob-code-addition { background: var(--add); }
.cm-body .blob-code-marker-deletion::before { content: "−"; color: var(--del-ink); margin-right: 8px; }
.cm-body .blob-code-marker-addition::before { content: "+"; color: var(--add-ink); margin-right: 8px; }
/* Writing: Write and Preview, the text, its buttons. */
.cmp { border-radius: 10px; background: var(--sheet); box-shadow: inset 0 0 0 1px var(--hair); overflow: hidden; transition: box-shadow var(--fast) var(--ease); }
.cmp:focus-within { box-shadow: inset 0 0 0 1px rgba(92, 157, 248, .55); }
.cmp-tabs { display: flex; align-items: center; gap: 14px; padding: 9px 8px 0 12px; }
.cmp-tabs > button:not(.ib) { appearance: none; border: 0; background: none; padding: 0 0 6px; color: var(--text-3); font: 600 12px/1 var(--ui); cursor: pointer; box-shadow: inset 0 -2px 0 transparent; }
.cmp-tabs > button:not(.ib):hover { color: var(--text-2); }
.cmp-tabs > button[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--text); }
/* A box's switch: a note for your agent, or a comment on GitHub. */
.cmp-mode { margin-bottom: 4px; }
.cmp-mode button { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; font-size: 11.5px; }
.cmp-mode .sw { width: 6px; height: 6px; border-radius: 50%; background: var(--local); }
.cmp-mode .sw.gh { background: var(--gh); }
.cmp-tabs .sp { flex: 1; }
.cmp-tabs .ib { width: 26px; height: 24px; margin-bottom: 4px; }
.cmp-tabs .ib svg { width: 14px; height: 14px; }
.cmp-ta { display: block; width: 100%; min-height: 84px; padding: 8px 12px; border: 0; outline: none; background: transparent; color: var(--text); font: 400 13px/1.5 var(--code); resize: none; overflow-y: hidden; }
.cmp-ta::placeholder { color: var(--text-3); }
.cmp-pre { min-height: 84px; padding: 8px 12px; }
.cmp-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px 8px 12px; }
.cmp-f .sp { flex: 1; }
.cmp-hint { font-size: 11.5px; color: var(--text-3); }
.cmp-err { padding: 4px 12px; color: var(--del-ink); font: 500 12.5px/1.4 var(--ui); }
.fthreads { position: sticky; left: 0; max-width: 900px; padding: 4px 22px 2px; }
.fthreads .th { position: static; width: auto; margin: 6px 0 10px; }
.th-away { appearance: none; display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 6px; padding: 6px 10px; border: 0; border-radius: 8px; background: var(--raised); color: var(--text-2); font: 500 12.5px/1.3 var(--ui); cursor: pointer; }
.th-away:hover { color: var(--text); }
.th-away .tw { display: inline-grid; color: var(--text-3); }
.th-away svg { width: 14px; height: 14px; }
.th-hunk { margin-top: 6px; padding: 8px 12px; border-radius: 10px 10px 0 0; background: var(--ground); font: 12px/1.5 var(--code); white-space: pre; overflow-x: auto; color: var(--text-2); }
.th-hunk + .th { margin-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
.th-hunk .no { display: inline-block; min-width: 30px; margin-right: 10px; text-align: right; color: var(--text-4); }
.th-hunk .d { background: var(--del); }
/* Notes: threads kept on this machine, with orchid on their edge, the note's number for an avatar. */
.th.note { box-shadow: inset 2px 0 0 var(--local); }
.th.note.flash-th { animation-name: flashnt; }
@keyframes flashnt { 0% { box-shadow: inset 2px 0 0 var(--local), 0 0 0 2px var(--local); } 100% { box-shadow: inset 2px 0 0 var(--local), 0 0 0 2px transparent; } }
.th.note.resolved { box-shadow: inset 2px 0 0 var(--hair-2); }
.th.new.note { box-shadow: inset 2px 0 0 var(--local), inset 0 0 0 1px rgba(224, 138, 216, .3); }
.th.new.note .th-new-h svg { color: var(--local); }
.th.note .cm { grid-template-columns: 28px minmax(0, 1fr); }
.th.note .th-f { padding-left: 52px; }
.th.note.by-agent .th-fold .ag-mark { color: var(--local-ink); font: 700 12px/1 var(--ui); }
.nt-n { display: block; width: 28px; height: 20px; border-radius: 6px; background: var(--local-soft); color: var(--local-ink); font: 700 11px/20px var(--code); text-align: center; }
.av.ag { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: #2A2030; color: var(--local-ink); font: 700 12px/1 var(--ui); }
.cm-tag.local { color: var(--local-ink); background: var(--local-soft); }
.cm-tag.since, .cm-tag.held { color: var(--accent-ink); background: var(--accent-soft); }
.cm-tag code { font-size: 10.5px; color: inherit; }
.cm-st { font-size: 11.5px; color: var(--text-3); }
.cm-st.warn { color: var(--local-ink); }
.th-tools { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.th-tools .btn { background: var(--hover); color: var(--text-2); }
.th-tools .btn:hover { background: #2A2A31; color: var(--text); }
.nt-was { margin: 4px 14px 10px 52px; padding: 6px 0; border-radius: 8px; background: var(--sheet); font: 400 12px/19px var(--code); overflow-x: auto; }
.nt-was p { margin: 0; padding: 0 10px 4px; font: 500 11.5px/1.4 var(--ui); color: var(--text-3); }
.nt-was .r { display: flex; white-space: pre; background: var(--del); }
.nt-was .no { width: 40px; flex: none; padding-right: 10px; text-align: right; color: var(--del-no); }
.nt-was .tx { padding-right: 12px; color: #C9C9D1; }
.nt-quote { display: grid; gap: 4px; margin: 10px 14px 0 52px; font-size: 12px; }
.nt-quote .cm-body { font-size: 12.5px; }
.th-away.note .tw { color: var(--local); }
.cmp.local:focus-within { box-shadow: inset 0 0 0 1px rgba(224, 138, 216, .55); }
.cmp-dest { display: inline-flex; align-items: center; gap: 6px; }
.cmp-dest i { width: 7px; height: 7px; border-radius: 50%; background: var(--gh); }
.cmp-dest.local i { background: var(--local); }
.cmp-dest b { color: var(--text-2); font-weight: 600; }
/* In local mode, the + and the lines a note is written on are orchid. */
.vw.local .cm-add { background: var(--local); color: #22101F; }
.vw.local .ln.cm-sel, .vw.local .sl.cm-sel, .vw.local .ln.cm-drag, .vw.local .sl.cm-drag, .vw.local .ln.cm-sel .g, .vw.local .ln.cm-drag .g, .vw.local .sl.cm-sel .g, .vw.local .sl.cm-drag .g { background-image: linear-gradient(var(--local-soft), var(--local-soft)); }
.vw.local .ln.cm-sel .g, .vw.local .ln.cm-drag .g, .vw.local .sl.cm-sel .g, .vw.local .sl.cm-drag .g { box-shadow: inset 2px 0 0 var(--local); }
/* The pull request's conversation. */
.conv { position: sticky; left: 0; display: grid; gap: 12px; max-width: 900px; padding: 4px 22px 40px; }
.conv > .cm { padding: 12px 14px; border-radius: 10px; background: var(--raised); }
.conv > .cm .cm-tools { top: 9px; }
.tl-ev { display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 12.5px; color: var(--text-2); }
.tl-ev.ok::before, .tl-ev.no::before { content: ""; order: -1; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.tl-ev.ok::before { background: var(--done); } .tl-ev.no::before { background: var(--del-ink); }
.tl-body { margin-left: 28px; padding: 10px 14px; border-radius: 10px; background: var(--raised); }
.pr-state { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.pr-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3FB950; }
.pr-state.merged::before { background: #AB7DF8; } .pr-state.closed::before { background: #F85149; } .pr-state.draft::before { background: var(--text-3); }
/* The review: the top bar's button and its popover. */
.rv-btn .rv-n { display: inline-block; padding: 2px 6px; border-radius: 999px; background: var(--gh); color: #06101F; font: 600 11px/1 var(--ui); }
.rv-btn svg { width: 13px; height: 13px; margin-right: -3px; }

/* Suggestions for @ and # in comments. */
.mn-pop { position: fixed; z-index: 75; display: grid; grid-template-columns: minmax(0, 1fr); width: min(420px, calc(100vw - 16px)); max-height: 280px; overflow: hidden auto; padding: 4px; border-radius: 10px; background: var(--raised); box-shadow: var(--float); }

/* ---- Jump to: chains, files, symbols and threads by name (Ctrl K). The keys (?). */
.scrim { position: fixed; inset: 0; z-index: 70; background: rgba(5, 5, 7, .55); }
.scrim[hidden] { display: none; }
.pal { position: fixed; left: 50%; top: 64px; z-index: 71; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: min(640px, calc(100vw - 32px)); max-height: min(580px, calc(100vh - 96px)); transform: translateX(-50%); border-radius: 14px; background: var(--raised); box-shadow: 0 0 0 1px var(--hair), 0 24px 64px rgba(0, 0, 0, .7); overflow: hidden; }

.keys { position: fixed; left: 50%; top: 50%; z-index: 71; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; transform: translate(-50%, -50%); padding: 18px 20px 14px; border-radius: 14px; background: var(--raised); box-shadow: 0 0 0 1px var(--hair), 0 24px 64px rgba(0, 0, 0, .7); }

/* Motion's helpers: a gap closing (with what was there, settling as reviewed), rows opening. */
.ghost, .grow { overflow: hidden; }
.ghost { pointer-events: none; }
.ghost .ln, .ghost .sl, .ghost .half, .ghost .g, .ghost .ln > :not(.g), .ghost .sl > .half { transition: background-color var(--med) var(--ease), opacity var(--med) var(--ease); }

.ghost.settle .ln > :not(.g), .ghost.settle .sl > .half { opacity: .55; }

/* A comment's tools on a touch screen: behind a ⋯, as a menu. */
.cm-more { display: none; position: absolute; right: 8px; top: 3px; }
.cm.first .cm-more { top: 9px; }

   its mark, a text box is 16 pixels (or the phone zooms the page in as it takes the focus), and
   keys aren't hinted. A browser without a mouse that isn't touched either (a headless one) is
   neither. */

  .hov, .hh-x { opacity: 1; }

  .cm-tools { display: none; }
  .cm-more { display: grid; }
  .cm-t { right: 44px; }
  .ln .tick:not(.on), .sl .tick:not(.on) { box-shadow: inset 0 0 0 1.5px var(--accent); }
}
@media (pointer: coarse) {
  .cmp-ta, .rv-ta, .pal-in input { font-size: 16px; }

}
/* A narrow view of the tests: a test's sentence takes the row, its details go on a line under it,

  .ol-row { grid-template-columns: 14px minmax(0, 1fr) 24px; }
  .ol-meta { grid-column: 2 / 4; grid-row: 2; justify-self: start; flex-wrap: wrap; row-gap: 4px; }
  .ol-meta > .tick, .ol-meta > .ol-tick-sp { position: absolute; right: 8px; top: 7px; }
  .ol-bar > .mini-seg:first-child { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
}

  .vw-where { display: grid; gap: 4px; flex: 1 1 0; min-width: 0; height: 52px; align-content: center; padding: 0 6px 0 2px; }
  .vw-where b { font: 600 14px/1.15 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .vw-agents { margin-right: 2px; }

  .vw-fresh { order: 9; flex: 1 0 100%; height: 40px; margin: 0 calc(-1 * max(4px, env(safe-area-inset-right))) 0 calc(-1 * max(4px, env(safe-area-inset-left))); padding: 0 6px 0 16px; border-radius: 0; }
  .vw-body, .vw.side-off .vw-body { grid-template-columns: minmax(0, 1fr); }
  .vw-split, .vw-mini { display: none !important; }
  /* Contents: the sidebar over the view, from the left, from ☰. */
  .vw-side, .vw.side-off .vw-side { position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; visibility: hidden; width: min(86vw, 340px); padding: env(safe-area-inset-top) 10px calc(28px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: var(--ground); box-shadow: 1px 0 0 var(--hair), 24px 0 48px rgba(0, 0, 0, .6); overscroll-behavior: contain; transform: translateX(-100%); transition: transform var(--slow) var(--ease), visibility 0s linear var(--slow); }
  .vw.side-on .vw-side { visibility: visible; transform: none; transition: transform var(--slow) var(--ease); }
  .vw-shade { display: block; position: fixed; inset: 0; z-index: 49; background: rgba(5, 5, 7, .6); opacity: 0; pointer-events: none; transition: opacity var(--slow) var(--ease); }
  .vw.side-on .vw-shade { opacity: 1; pointer-events: auto; }
  .sb-pr { display: grid; gap: 8px; padding: 14px 2px 4px 6px; }
  .sb-pr .t-pr { max-width: none; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font: 600 15px/1.35 var(--ui); }
  .sb-pr .t-num { font: 500 12.5px/1 var(--code); }
  .sb-pr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  /* The view: the whole pane, its header scrolling away with it; the review bar docked under it. */
  .vw-sheet, .vw.side-off .vw-sheet { border-radius: 0; }
  .vw-main, .vw.mini-on .vw-main { right: 0; }
  .vw-sheet:has(> .vw-pill:not([hidden])) .vw-main { bottom: calc(56px + env(safe-area-inset-bottom)); }
  .vw-main::after { height: 24px; }

  .facts { flex-basis: 100%; order: -1; white-space: normal; }
  .vw-pill { left: 0; right: 0; bottom: 0; transform: none; height: calc(56px + env(safe-area-inset-bottom)); gap: 2px; padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px, env(safe-area-inset-left)); border-radius: 0; box-shadow: 0 -1px 0 var(--hair); }
  .vw.mini-on .vw-pill { margin-left: 0; }
  .vw-pill .ib { width: 44px; height: 44px; }
  .vw-pill .ib svg { width: 18px; height: 18px; }
  .pill-sep { display: none; }
  .pill-n { min-width: 0; font-size: 13px; }
  .pill-n + .ib { margin-right: auto; }

  .pill-act kbd { display: none; }
  .pill-l { font-size: 0; }
  .pill-l::after { content: attr(data-s); font-size: 14px; }
  .pill-msg { margin-right: auto; padding-left: 12px; }
  .toast { left: 16px; right: 16px; bottom: calc(68px + env(safe-area-inset-bottom)); width: fit-content; max-width: calc(100% - 32px); margin: 0 auto; }
  /* Menus and cards rise from the bottom as sheets, full width, over a shade, with a handle to
     swipe them down. The app bar's cards stay above the shade with it. */
  .vw.sheet-on .vw-shade { opacity: 1; pointer-events: auto; }
  /* The app bar goes back under the shade once the shade has faded: at once, it would flash dark
     as a sheet closes. */
  .vw-bar { transition: z-index 0s var(--slow); }
  .vw.sheet-on .vw-bar { z-index: 55; transition: none; }
  .menu.sheet, .rv-pop, .ag-pop { position: fixed; top: auto; right: 0; bottom: 0; left: 0; z-index: 60; width: auto; min-width: 0; max-width: none; max-height: 85dvh; overflow: auto; overscroll-behavior: contain; border-radius: 16px 16px 0 0; box-shadow: 0 -1px 0 var(--hair-2), 0 -24px 48px rgba(0, 0, 0, .6); }
  .menu.sheet { padding: 0 8px calc(12px + env(safe-area-inset-bottom)); }
  .menu.sheet.panel { width: auto; padding: 0 12px calc(16px + env(safe-area-inset-bottom)); }
  .menu.sheet.lens-pop { width: auto; max-height: 85dvh; padding: 0 0 env(safe-area-inset-bottom); grid-template-rows: 24px auto auto minmax(0, 1fr) auto; }
  .menu.sheet.lens-pop .sh-h { margin: 0; }
  .rv-pop, .ag-pop { padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
  .sh-h { position: sticky; top: 0; z-index: 1; display: grid; place-items: center; height: 24px; margin: 0 -16px; background: var(--raised); cursor: grab; touch-action: none; }
  .menu.sheet .sh-h { margin: 0 -8px; }
  .sh-h::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--hair-2); }
}
@media (max-width: 960px) and (pointer: coarse) {

  .rv-pop .btn, .ag-pop .btn, .menu.sheet .mi-foot .btn { height: 44px; padding: 0 16px; font-size: 13.5px; }
  .vw-side .sb-row { height: auto; min-height: 44px; font-size: 14px; }
  .vw-side .sb-row.tr { contain-intrinsic-size: auto 44px; }
  .vw-side .sb-row.chain .nm { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; line-height: 1.3; }
  .vw-side .sb-row.chain .nm.ui, .vw-side .sb-row.map .nm { font-size: 14px; }

}
/* Code in a narrow window: its size is ⋯'s (rows follow it); notes, comments and peeks take the
   view's width, 12 pixels from each edge; a file's name comes before its folders. On a phone, the
   gutter is the mark (20), one line number (34) and the sign (12). */
.pname, .pdir { white-space: nowrap; }
@media (max-width: 960px) {
  .vw { --code-fs: 12.5px; --row: calc(var(--code-fs) * 1.6); }
  .code { font-size: var(--code-fs); line-height: 1.6; }
  .vw-main .code { contain-intrinsic-height: auto calc(var(--rows, 40) * var(--row)); }
  .code > .ln, .code > .sl { contain-intrinsic-size: auto var(--row); }
  .peek, .th { left: 12px; width: calc(100cqw - 24px); margin-left: 12px; }
  .pk-code { max-height: 50dvh; }

  .sec-file .pname, .inst-file .pname { font: 600 12.5px/1.45 var(--code); color: var(--text-2); }
  .sec-file .pdir, .inst-file .pdir { font: 400 11px/1.45 var(--code); color: var(--text-4); white-space: normal; overflow-wrap: anywhere; }
  .sec-file, .inst-file { padding-top: 10px; }
  /* Wrapped: a line's next rows start under its indent, plus two. */

  .vw.wrap .code > .ln { content-visibility: visible; }
  .vw.wrap .ln .tx { flex: 1 1 auto; min-width: 0; padding-right: 12px; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: calc(var(--i, 0) * 1ch + 2ch); text-indent: calc(var(--i, 0) * -1ch - 2ch); }
  .vw.wrap .pk-ln { white-space: pre-wrap; overflow-wrap: anywhere; }
  .vw.wrap .pk-ln > :last-child { min-width: 0; }
}
@media (max-width: 520px) {
  .vw { --code-fs: 12px; --gut: 20px; --num: 34px; --sign: 12px; --text-x: 66px; }
  .ln .no, .half .no { padding-right: 6px; font-size: 11px; }
  .hh-at { padding-right: 6px; }
  .sec-h, .sec-note, .sec-file, .inst-file, .sym-h, .more-row, .fv-note, .cm-note, .strip, .graph-box, .ol-bar { padding-left: 16px; padding-right: 16px; }
  .wb { padding-left: 16px; }
}
@media (max-width: 960px) and (pointer: coarse) {
  .hh { height: 40px; }
  .hh .mo, .hh .chip-btn { height: 32px; padding: 0 12px 0 10px; }
  .hh .chev { width: 32px; height: 32px; }
  .hh-x .btn { height: 32px; padding: 0 12px; }
  .th-reply { height: 44px; font-size: 14px; }
  .cm-more { width: 32px; height: 32px; }
}
/* Picked lines, on a touch screen: tinted as a comment's lines are while it's written (orchid for
   notes), and the review bar says what's picked, with what to do with them. A line's mark is the
   gutter's to tap: it picks the line. */
.ln.cm-pick, .ln.cm-pick .g { background-image: linear-gradient(var(--gh-soft), var(--gh-soft)); }
.ln.cm-pick .g { box-shadow: inset 2px 0 0 var(--gh); }
.vw.local .ln.cm-pick, .vw.local .ln.cm-pick .g { background-image: linear-gradient(var(--local-soft), var(--local-soft)); }
.vw.local .ln.cm-pick .g { box-shadow: inset 2px 0 0 var(--local); }
.vw.local .ln.cm-pick .no { color: var(--local-ink); }
.pick-what { display: grid; gap: 3px; min-width: 0; padding: 0 4px 0 2px; }
.pick-what b { font: 600 13px/1.1 var(--ui); color: var(--text); white-space: nowrap; }
.pick-what small { font: 500 11.5px/1.1 var(--code); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vw-pill.pick > .sp { flex: 1; }
.pick-note svg { width: 15px; height: 15px; }
.pick-note.local { background: var(--local); color: #22101F; }
.pick-note.local:hover { background: var(--local-ink); }
.vw-pill.pick .pill-act { padding: 0 14px 0 11px; }
@media (hover: none) and (pointer: coarse) {
  .ln > .g .tick { pointer-events: none; }
}
/* The box you write in, in a narrow window: a sheet on the keyboard, the view above it. */
.vw-compose { display: none; }
@media (max-width: 960px) {
  .vw.composing .vw-compose { display: block; position: fixed; right: 0; bottom: var(--kb, 0px); left: 0; z-index: 62; max-height: calc(var(--vvh, 100dvh) - 72px); overflow: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); border-radius: 16px 16px 0 0; background: var(--raised); box-shadow: 0 -1px 0 var(--hair-2), 0 -24px 48px rgba(0, 0, 0, .6); }
  .vw-compose .th.new { position: static; width: auto; margin: 0; border-radius: 0; background: none; box-shadow: none; }
  .vw-compose .th.new .cmp { margin: 0 12px 12px; }
  .vw.composing .vw-main { bottom: calc(var(--kb, 0px) + var(--compose-h, 0px)) !important; }
  .vw.composing .vw-pill { display: none; }
  .vw-pill.pick { gap: 0; }
}
/* The other views in a narrow window. Tests: Nested or Sentences is in ⋯, a level is 14 pixels on a
   phone, a mark is 44 pixels wide to tap. Jump to takes the whole visible window, over the
   keyboard, with its scopes as chips and a file's name over its folders. A graph scrolls inside its
   box. */
.pal-back, .pal-scopes { display: none; }
@media (max-width: 960px) {
  .ol-bar > .mini-seg ~ .mini-seg { display: none; }
  .graph-scroll:not(.tall) { max-height: 60dvh; }
  .pal { top: var(--vvt, 0px); left: 0; width: 100%; height: var(--vvh, 100dvh); max-height: none; transform: none; border-radius: 0; box-shadow: none; grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .pal-in { height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0 4px; gap: 6px; }
  .pal-in > svg { display: none; }
  .pal-back { display: grid; width: 44px; height: 44px; }
  .pal-back svg { width: 18px; height: 18px; }
  .pal-in input { height: 40px; padding: 0 12px; border-radius: 10px; background: var(--sheet); }
  .pal-scope { display: none; }
  .pal-scopes { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; box-shadow: inset 0 -1px 0 var(--hair); }
  .pal-scopes .chip-btn { flex: none; height: 32px; padding: 0 12px; font: 600 12.5px/1 var(--ui); }
  .pal-r { min-height: 52px; height: auto; padding: 6px 12px; }
  .pal-r .nm:has(> .fn) { display: flex; flex-direction: column-reverse; gap: 3px; white-space: normal; }
  .pal-r .nm > .fn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal-r .nm > .dir { font: 400 11px/1.35 var(--code); color: var(--text-3); overflow-wrap: anywhere; }
  .scrim[data-owner="pal"] { display: none; }
}
@media (max-width: 520px) {
  .vw { --ol-step: 14px; }
  .ol-row { margin: 0 4px; }
}
@media (hover: none) and (pointer: coarse) {
  .ol-tick::before, .ol-file .tick::before { content: ""; position: absolute; inset: -10px -4px -10px -26px; }
}
/* Held sideways, a phone is short: the bars give back some of their height. */
@media (max-width: 960px) and (max-height: 500px) {
  .vw-bar { min-height: calc(44px + env(safe-area-inset-top)); }
  .vw-where { height: 44px; }
  .vw-pill { height: calc(48px + env(safe-area-inset-bottom)); }
  .vw-sheet:has(> .vw-pill:not([hidden])) .vw-main { bottom: calc(48px + env(safe-area-inset-bottom)); }
}
/* The panes are as big as the window gives them: what changes in one never lays out the other. */
@media (min-width: 961px) {
  .vw-side, .vw-main { contain: strict; }
}
</style>
</head>

<div class="vw" id="viewer">

        <span class="lsp-row"><span>CPU</span><b data-m="cpu">…</b></span>
        <span class="lsp-row"><span>Active resources</span><b data-m="resources">…</b></span>
        <span class="lsp-row"><span>Language server’s memory</span><b data-m="lspRss">…</b></span>
        <span class="lsp-row"><span>Language server’s CPU</span><b data-m="lspCpu">…</b></span>
        <button type="button" class="btn sm lsp-free" id="lsp-free" data-act="lsp-restart" title="Start the language server over: it lets go of what it loaded for the definitions you went to. Go to definition waits for it while it starts" hidden>Free its memory</button>
      </span>
    </div>
    <div class="vw-agents" id="vw-agent" hidden></div>
    <div class="vw-review" id="vw-review" hidden></div>
    <button type="button" class="ib vw-more" id="vw-more" data-act="menu" data-menu="more" title="More: notes, the commit, the view, the language server" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.25"/><circle cx="8" cy="8" r="1.25"/><circle cx="12.5" cy="8" r="1.25"/></svg></button>
  </header>
  <div class="vw-body">
    <nav class="vw-side" id="vw-side" aria-label="Chains, files and threads"></nav>
    <div class="vw-shade" id="vw-shade" data-act="shade" aria-hidden="true"></div>
    <div class="vw-split" id="vw-split" role="separator" aria-orientation="vertical" aria-label="Sidebar width" tabindex="0"></div>
