<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*TITLE*/</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0B0D'/%3E%3Cpath d='M7 22c4-9 8 6 12-3s4-6 6-6' fill='none' stroke='%23E9B44C' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<!--FONTS-->
<!--PRESENCE-->
<style>
/* Deliberately dark-only. Three surfaces set the regions apart: the ground (the top bar and the
   sidebar), the sheet the code sits on, and what floats over it, raised. One accent, amber, means
   "to review"; a green check confirms what's done; blue marks what comes from GitHub; red and
   green stay inside the diff. Borders only on what floats. */
:root {
  --ground: #0B0B0D;
  --sheet: #121215;
  --raised: #1B1B20;
  --hover: #222228;
  --hover-soft: #141418;
  --hair: #26262D;
  --hair-2: #33333B;
  --text: #E8E8EC;
  --text-2: #A6A6B0;
  --text-3: #6F6F7A;
  --text-4: #4E4E58;
  --accent: #E9B44C;
  --accent-soft: rgba(233, 180, 76, .14);
  --accent-ink: #F0C46C;
  --done: #58C597;
  --done-soft: rgba(88, 197, 151, .16);
  --gh: #5C9DF8;
  --gh-soft: rgba(92, 157, 248, .14);
  /* Notes: comments kept on this machine, for a coding agent. */
  --local: #E08AD8;
  --local-soft: rgba(224, 138, 216, .13);
  --local-ink: #EDB0E7;
  /* Diff tints, opaque over the sheet: a sticky gutter over them hides what scrolls under it. */
  --add: #16231B;
  --add-strong: #1F4126;
  --add-ink: #7EE2A0;
  --add-no: #5C8A6A;
  --del: #29181A;
  --del-strong: #522424;
  --del-ink: #FF9B95;
  --del-no: #9A5E5B;
  --mv: #1D1B28;
  --mv-ink: #B9A8FF;
  --row-hover: #18181B;
  --cm-sel: #1B2330;
  --syn-kw: #C586C0;
  --syn-ty: #4EC9B0;
  --syn-str: #CE9178;
  --syn-num: #B5CEA8;
  --syn-com: #6A9955;
  --syn-ann: #DCDCAA;
  --syn-fn: #DCDCAA;
  --syn-id: #9CDCFE;
  --syn-op: #CCCCCC;
  --float: 0 0 0 1px var(--hair), 0 12px 32px rgba(0, 0, 0, .55);
  --ui: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --code: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* Motion: fast enough not to wait for, easing out. */
  --ease: cubic-bezier(.2, 0, 0, 1);
  --fast: 120ms;
  --med: 200ms;
  --slow: 280ms;
  /* The code's gutter: the review mark, one line number, the sign; text starts after them. */
  --row: 20.625px;
  --gut: 26px;
  --num: 44px;
  --sign: 16px;
  --text-x: 86px;
  --side-w: 272px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--text); font: 400 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
p { margin: 0; }
a { color: inherit; }
code, .mono { font-family: var(--code); font-size: .92em; }
.muted { color: var(--text-3); }
.a { color: var(--add-ink); } .d { color: var(--del-ink); }
:focus-visible { outline: 2px solid rgba(232, 232, 236, .55); outline-offset: 2px; }
kbd { display: inline-block; font: 500 10.5px/1 var(--ui); color: var(--text-3); background: var(--raised); border-radius: 5px; padding: 3px 6px; white-space: nowrap; }
mark { background: var(--accent-soft); color: var(--accent-ink); border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* Buttons: one primary per view, the rest quiet. */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--raised); color: var(--text); font: 600 12.5px/1 var(--ui); white-space: nowrap; cursor: pointer; text-decoration: none; transition: background-color var(--fast) var(--ease); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--text); color: var(--ground); }
.btn.primary:hover { background: #FFF; }
.btn.sm { height: 28px; padding: 0 10px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn[aria-busy="true"] { opacity: .75; }
.btn:disabled { cursor: default; opacity: .55; }
.ib { appearance: none; display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); cursor: pointer; text-decoration: none; flex: none; transition: background-color var(--fast) var(--ease), color var(--fast) var(--ease); }
.ib:hover { background: var(--raised); color: var(--text); }
.ib[aria-pressed="true"], .ib[aria-expanded="true"] { background: var(--raised); color: var(--text); }
.ib svg { display: block; width: 15px; height: 15px; }
.linkish { appearance: none; border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--text-4); text-underline-offset: 3px; }
.linkish:hover { color: var(--text); text-decoration-color: var(--text-2); }
.chip-btn { appearance: none; border: 0; background: var(--raised); color: var(--text-2); font: 500 12px/1 var(--code); height: 26px; padding: 0 10px; border-radius: 999px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-btn:hover { color: var(--text); background: var(--hover); }
.chip-btn.on { background: var(--text); color: var(--ground); }
.mini-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--ground); }
.mini-seg button { appearance: none; border: 0; background: transparent; color: var(--text-3); font: 600 12px/1 var(--ui); height: 24px; padding: 0 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.mini-seg button:hover { color: var(--text-2); }
.mini-seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.mini-seg button .dt { margin: 0 5px; color: var(--text-4); font-weight: 500; }
.mini-seg button i { font-style: normal; font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
.mini-seg button[aria-pressed="true"] i { color: var(--text-2); }
.mini-seg button:disabled { cursor: default; opacity: .45; }
.mini-seg button:disabled:hover { color: var(--text-3); }
.tag { font: 500 11px/1.4 var(--ui); color: var(--text-2); background: var(--raised); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .3; } }

/* ---- The frame: the top bar, then the sidebar and the sheet. */
.vw { height: 100vh; display: grid; grid-template-rows: 44px minmax(0, 1fr); }
.vw-bar { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0 12px 0 16px; }
.vw-bar > .sp { flex: 1 1 0; min-width: 8px; }
.vw-side-btn { margin: 0 -4px 0 -6px; }
.vw-side-btn[hidden] { display: none; }
.vw-title { display: flex; align-items: center; gap: 18px; min-width: 0; }
/* Reviews: the others, from this one. Its count is the ones that need you. */
.vw-revs { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 7px; flex: none; height: 30px; margin-right: 2px; padding: 0 9px; border-radius: 8px; background: var(--raised); color: var(--text-2); font: 600 12.5px/1 var(--ui); white-space: nowrap; cursor: pointer; }
.vw-revs:hover, .vw-revs[aria-expanded="true"] { background: var(--hover); color: var(--text); }
.vw-revs b { min-width: 18px; padding: 3px 6px; border-radius: 999px; background: var(--accent); color: #1A1406; font: 700 11px/1 var(--ui); text-align: center; }
.menu.revs-pop { width: min(520px, calc(100vw - 16px)); max-width: none; padding: 10px; gap: 2px; }
.rv-h { display: flex; align-items: baseline; gap: 8px; padding: 2px 6px 8px; font: 600 12.5px/1.3 var(--ui); color: var(--text); }
.rv-h .linkish { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-2); }
.rv-it { appearance: none; border: 0; background: none; color: var(--text); font: inherit; text-align: left; display: grid; grid-template-columns: 12px 58px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 40px; padding: 0 8px; border-radius: 8px; font-size: 12.5px; cursor: pointer; }
.rv-it:hover, .rv-it:focus-visible { background: var(--hover); }
.rv-it .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); justify-self: center; }
.rv-it .dot.need { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rv-it .dot.paused { background: none; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.rv-it .num { font: 500 12px/1 var(--code); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-it .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-it small { font-size: 11.5px; color: var(--text-3); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.rv-it small.need { color: var(--local-ink); }
.rv-none { padding: 6px 8px 10px; font-size: 12.5px; color: var(--text-3); }
.rv-new { appearance: none; border: 0; border-top: 1px solid var(--hair); background: none; color: var(--text-2); font: 500 12.5px/1 var(--ui); display: flex; align-items: center; gap: 9px; height: 36px; margin-top: 4px; padding: 0 8px; cursor: pointer; }
.rv-new:hover { color: var(--text); }
.rv-new kbd { margin-left: auto; }
.t-pr { min-width: 0; max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 500; color: var(--text); text-decoration: none; }
a.t-pr:hover { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
.t-num { font: 500 12.5px/1 var(--code); color: var(--text-3); margin-right: 6px; }
.t-pr code { font-size: 12.5px; color: var(--text-2); }
.t-state { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.t-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3FB950; }
.t-state.merged::before { background: #AB7DF8; } .t-state.closed::before { background: #F85149; } .t-state.draft::before { background: var(--text-3); }
.t-commit { display: inline-flex; align-items: center; gap: 8px; font: 500 11.5px/1 var(--code); color: var(--text-3); white-space: nowrap; }
.t-commit .ib { width: 22px; height: 22px; color: var(--text-3); }
.t-commit .ib svg { width: 13px; height: 13px; }
.t-unsaved { display: none; font: 500 11.5px/1 var(--ui); color: var(--del-ink); white-space: nowrap; }
.vw.unsaved .t-unsaved { display: inline; }
.vw-fresh { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 3px 0 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); font: 500 12.5px/1 var(--ui); white-space: nowrap; min-width: 0; }
.vw-fresh[hidden] { display: none; }
.vw-fresh > span:not(.spin) { overflow: hidden; text-overflow: ellipsis; }
.vw-fresh code { color: var(--text); }
.vw-jump { appearance: none; border: 0; display: flex; align-items: center; gap: 8px; flex: 0 1 330px; min-width: 150px; height: 30px; padding: 0 6px 0 10px; border-radius: 8px; background: var(--sheet); color: var(--text-3); font: 400 12.5px/1 var(--ui); cursor: pointer; transition: background-color var(--fast) var(--ease), color var(--fast) var(--ease); }
.vw-jump:hover { background: var(--raised); color: var(--text-2); }
.vw-jump svg { flex: none; }
.vw-jump span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vw-jump kbd { margin-left: auto; }
.vw-lsp { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; border-radius: 999px; cursor: default; flex: none; transition: background-color var(--fast) var(--ease); }
.vw-lsp:hover, .vw-lsp:focus-visible { background: var(--hover-soft); }
.lsp-use { font: 500 11.5px/1 var(--code); color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lsp-use:empty { display: none; }
.vw-lsp[hidden] { display: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--text-4); flex: none; }
.dot.ready { background: var(--done); box-shadow: 0 0 0 3px rgba(88, 197, 151, .15); }
.dot.starting { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.dot.failed { background: var(--del-ink); }
.lsp-pop { display: none; position: absolute; right: -10px; top: calc(100% + 10px); z-index: 45; width: 280px; padding: 12px 14px; border-radius: 12px; background: var(--raised); box-shadow: var(--float); gap: 7px; font-size: 12.5px; color: var(--text-2); white-space: normal; }
.vw-lsp:hover .lsp-pop, .vw-lsp:focus-within .lsp-pop { display: grid; }
/* The gap above it is part of it: the pointer crosses from the dot to its button. */
.lsp-pop::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 10px; }
.lsp-free { justify-self: start; margin-top: 4px; background: var(--hover); }
.lsp-free:hover { box-shadow: inset 0 0 0 1px var(--hair-2); }
.lsp-free[hidden] { display: none; }
.lsp-pop .lsp-h { display: grid; gap: 2px; color: var(--text); font-weight: 600; margin-bottom: 2px; }
.lsp-pid { color: var(--text-3); font: 500 12px/1.45 var(--code); }
.lsp-row { display: flex; justify-content: space-between; gap: 12px; }
.lsp-row b { color: var(--text); font: 500 12px/1.45 var(--code); }
.vw-review { position: relative; flex: none; }
/* The agents holding the review: each one's label says where its chat is (listening, working on
   notes, a line waiting for its turn, not listening, or gone), and opens a menu. */
.vw-agents { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.vw-agents[hidden] { display: none; }
.vw-agent-w { position: relative; flex: none; }
.vw-agent { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px 0 10px; border-radius: 999px; background: var(--local-soft); color: var(--local-ink); font: 600 12px/1 var(--ui); white-space: nowrap; cursor: pointer; }
.vw-agent svg { width: 12px; height: 12px; opacity: .7; }
.vw-agent .dot, .rv-agent .dot, .ag-pop h4 .dot { background: var(--local); }
.st-listening .dot { animation: pulse 1.8s ease-in-out infinite; }
.st-working .dot { width: 9px; height: 9px; background: none; border: 1.5px solid var(--local); border-right-color: transparent; animation: spin .9s linear infinite; }
.st-queued .dot { background: none; box-shadow: inset 0 0 0 1.5px var(--local); }
.vw-agent.st-deaf { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair-2); }
.st-deaf .dot { background: none; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.vw-agent.st-left { background: var(--raised); color: var(--text-3); }
.st-left .dot { background: var(--text-4); }
/* An agent's menu: where its chat is, what reaches it, and Wake while nothing listens there. */
.ag-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; display: grid; gap: 10px; width: min(360px, calc(100vw - 32px)); padding: 14px; border-radius: 12px; background: var(--raised); box-shadow: var(--float); color: var(--text-2); font: 400 12.5px/1.5 var(--ui); white-space: normal; text-align: left; }
.ag-pop h4 { margin: 0; display: flex; align-items: center; gap: 8px; color: var(--text); font: 600 13px/1.3 var(--ui); }
.ag-pop p { margin: 0; }
.ag-pop code { padding: .1em .3em; border-radius: 4px; background: var(--hover); color: var(--text); font: 500 11.5px var(--code); }
.ag-pop .ag-who { color: var(--text-3); font: 500 11.5px/1.45 var(--code); }
.ag-line { padding: 8px 10px; border-radius: 8px; background: var(--sheet); color: var(--text); font: 400 11.5px/1.5 var(--code); box-shadow: inset 2px 0 0 var(--local); overflow-wrap: anywhere; }
.ag-line small { display: block; margin-bottom: 5px; color: var(--text-3); font: 600 10px/1 var(--ui); letter-spacing: .07em; text-transform: uppercase; }
.ag-pop .cmp-err { margin: 0; }
.ag-pop .rv-f .btn:not(.primary) { background: var(--hover); }
.vw-review[hidden] { display: none; }
.vw-body { display: grid; grid-template-columns: var(--side-w) 0 minmax(0, 1fr); min-height: 0; }
.vw.side-off .vw-body { grid-template-columns: 0 0 minmax(0, 1fr); }
.vw.side-off .vw-side { visibility: hidden; padding: 0; }
.vw-side { position: relative; min-width: 0; overflow: hidden auto; padding: 0 10px 28px 12px; scrollbar-width: thin; scrollbar-color: var(--hair-2) transparent; container-type: inline-size; }
/* The sidebar's edge: dragged, it sets the sidebar's width; double-clicked, it hides the sidebar. */
.vw-split { position: relative; z-index: 6; outline: none; }
.vw-split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -5px; width: 10px; cursor: col-resize; }
.vw-split::after { content: ""; position: absolute; top: 14px; bottom: 14px; left: -1px; width: 2px; border-radius: 1px; background: transparent; transition: background-color var(--fast) var(--ease); }
.vw-split:hover::after, .vw-split:focus-visible::after, .vw-split.dragging::after { background: var(--text-3); transition-delay: 60ms; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }
.vw-sheet { position: relative; min-width: 0; min-height: 0; background: var(--sheet); border-radius: 12px 0 0 0; overflow: hidden; }
.vw.side-off .vw-sheet { border-radius: 0; }
/* The scrollbar's room is kept while nothing scrolls: what opens never narrows the page. */
.vw-main { position: absolute; inset: 0; overflow: auto; scrollbar-gutter: stable; container-type: inline-size; background: var(--sheet); scrollbar-width: thin; scrollbar-color: #2C2C34 transparent; }
.vw.mini-on .vw-main { right: 64px; }
.vw.mini-on .vw-pill { margin-left: -32px; }
/* Room under the last line for the review pill. */
.vw-main::after { content: ""; display: block; height: 88px; }
/* The minimap: the view's rows drawn small, at the right of the code. */
/* A canvas sizes itself from its pixels unless told: it takes the sheet's height. */
.vw-mini { position: absolute; top: 0; right: 0; width: 64px; height: 100%; display: block; cursor: pointer; touch-action: none; }
.vw-mini[hidden] { display: none; }

/* ---- The review pill: where you are among the changes to review, and the action that does the most. */
.vw-pill { position: absolute; left: 50%; bottom: 18px; z-index: 8; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px; border-radius: 999px; background: var(--raised); box-shadow: var(--float); font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.vw-pill[hidden] { display: none; }
.vw-pill .ib { width: 28px; height: 28px; border-radius: 50%; }
.vw-pill .ib:hover { background: var(--hover); }
.vw-pill .ib svg { width: 14px; height: 14px; }
.pill-n { display: inline-flex; gap: 4px; min-width: 52px; justify-content: center; font-variant-numeric: tabular-nums; }
.pill-n b { display: inline-block; color: var(--text); font-weight: 600; }
.pill-msg { padding: 0 4px 0 10px; }
.pill-sep { width: 1px; height: 18px; background: var(--hair-2); }
.pill-act { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 5px 0 12px; border-radius: 999px; background: var(--text); color: var(--ground); font: 600 12.5px/1 var(--ui); cursor: pointer; }
.pill-act:hover { background: #FFF; }
.pill-act kbd { background: rgba(0, 0, 0, .1); color: #3A3A44; border-radius: 999px; padding: 4px 7px; }

/* ---- The sidebar: what's left, three tabs, one line per chain, file or thread. */
.sb-top { position: sticky; top: 0; z-index: 3; background: var(--ground); padding-top: 6px; }
/* A short window: the sidebar's top, pinned views and all, scrolls with its list instead of covering it. */
@media (max-height: 560px) { .sb-top { position: relative; } }
.sb-prog { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; padding: 12px 2px 20px 6px; }
.sb-prog > b { font-size: 22px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.sb-prog > b svg { width: 18px; height: 18px; color: var(--done); vertical-align: -2px; }
.sb-prog > span { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-prog .ib { align-self: center; width: 26px; height: 24px; color: var(--text-3); }
.sb-bar { grid-column: 1 / -1; height: 3px; margin-top: 14px; border-radius: 2px; background: var(--raised); overflow: hidden; }
.sb-bar i { display: block; height: 100%; border-radius: 2px; background: var(--text-2); transition: width var(--slow) var(--ease); }
.sb-prog.all .sb-bar i { background: var(--done); }
.sb-tabs { display: flex; gap: 18px; padding: 0 6px; margin-bottom: 12px; }
.sb-tabs button { appearance: none; border: 0; background: none; padding: 0 0 8px; color: var(--text-3); font: 600 12.5px/1 var(--ui); cursor: pointer; box-shadow: inset 0 -2px 0 transparent; white-space: nowrap; transition: color var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
.sb-tabs button:hover { color: var(--text-2); }
.sb-tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--text); }
.sb-tabs i { font-style: normal; font-weight: 500; color: var(--text-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
@container (max-width: 340px) { .sb-tabs.four i { display: none; } }
.sb-pin { display: grid; padding-bottom: 8px; margin-bottom: 6px; box-shadow: 0 1px 0 var(--hair); }
.sb-group { display: flex; justify-content: space-between; gap: 8px; padding: 22px 6px 6px; font-size: 11.5px; color: var(--text-3); }
.sb-group span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-group > span + span { flex: none; white-space: nowrap; }
button.sb-group { appearance: none; border: 0; background: none; width: 100%; font-family: var(--ui); text-align: left; cursor: pointer; }
button.sb-group:hover { color: var(--text-2); }
/* The Threads tab's sections (notes, and what comes from GitHub): each folds. */
.sb-sec { appearance: none; display: flex; align-items: center; gap: 7px; width: 100%; margin-top: 14px; padding: 6px 6px; border: 0; border-radius: 6px; background: none; color: var(--text-2); font: 600 12px/1.2 var(--ui); text-align: left; cursor: pointer; }
.sb-sec:first-child { margin-top: 4px; }
.sb-sec:hover { background: var(--hover-soft); color: var(--text); }
.sb-sec .tw { display: inline-grid; color: var(--text-3); }
.sb-sec .tw svg { width: 12px; height: 12px; }
.sb-sec .sw { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--local); }
.sb-sec.github .sw { background: var(--gh); }
.sb-sec .nm { flex: 1; min-width: 0; }
.sb-sec .cnt { font: 500 11.5px/1 var(--ui); color: var(--text-3); font-variant-numeric: tabular-nums; }
.sb-sec-body > .sb-group:first-child { padding-top: 10px; }
.sb-row { appearance: none; position: relative; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 9px; width: 100%; height: 28px; padding: 0 8px 0 calc(8px + var(--d, 0) * 14px); border: 0; border-radius: 6px; background: transparent; color: var(--text); font: 400 12.5px/1 var(--ui); text-align: left; cursor: pointer; transition: background-color var(--fast) var(--ease); }
.sb-row:hover { background: var(--hover-soft); }
.sb-row[aria-current="true"] { background: var(--raised); }
.sb-row .nm { font: 500 12.5px/1.25 var(--code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.sb-row .nm.ui, .sb-row.dir .nm { font-family: var(--ui); }
.sb-row .own { color: var(--text-3); }
.sb-row .sn { font: 400 12px/1.25 var(--ui); color: var(--text-3); margin-left: 8px; }
.sb-row .cnt { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.df { display: none; font: 500 11.5px/1 var(--code); white-space: nowrap; font-variant-numeric: tabular-nums; }
.df::before { content: attr(data-a); color: var(--add-ink); }
.df::after { content: attr(data-d); color: var(--del-ink); }
.df[data-a][data-d]::after { margin-left: 6px; }
.sb-row > .df { grid-column: 3; grid-row: 1; }
.cm-row > .df { grid-column: 3; grid-row: 1 / span 2; }
.sb-row:hover > .df, .sb-row:focus-visible > .df, .cm-row:hover > .df, .cm-row:focus-visible > .df { display: inline-block; }
.sb-row:hover > .df ~ .cnt, .sb-row:focus-visible > .df ~ .cnt, .cm-row:hover > .df ~ .cm-n, .cm-row:focus-visible > .df ~ .cm-n { display: none; }
.sb-row.done .nm { color: var(--text-3); }
.sb-row.dir .nm { color: var(--text-2); font-weight: 500; }
.sb-row.dir.done .nm { color: var(--text-3); }
/* A chain open: the files it has no changes in fade, as its commits do in the Commits tab. The
   tree's lines stay. */
.sb-row.chain-out > :not(.ig) { opacity: .38; }
.sb-row.chain-out:hover > :not(.ig), .sb-row.chain-out:focus-visible > :not(.ig) { opacity: .8; }
/* A file the changes add is green, one they delete red and struck through, as in a diff; dimmer
   once reviewed. */
.vw-side .sb-row.s-a .nm { color: var(--add-ink); }
.vw-side .sb-row.s-a.done .nm { color: var(--add-no); }
.vw-side .sb-row.s-d .nm { color: var(--del-ink); text-decoration: line-through; text-decoration-color: var(--text-4); }
.vw-side .sb-row.s-d.done .nm { color: var(--del-no); }
.sb-row .tw { display: grid; place-items: center; width: 12px; height: 16px; color: var(--text-3); }
.sb-row .tw svg { width: 14px; height: 14px; flex: none; }
/* A row's mark: amber while it has changes to review, a check once they're all reviewed. */
.mk { display: block; justify-self: center; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.mk.ok { display: grid; place-items: center; width: 12px; height: 12px; background: none; color: var(--done); }
.mk.ok svg { width: 12px; height: 12px; }
.mk.gen { background: none; box-shadow: inset 0 0 0 1.5px var(--text-4); }
.mk.gh { background: var(--gh); }
.mk.pend { background: none; box-shadow: inset 0 0 0 1.5px var(--gh); }
.mk.note { background: none; box-shadow: inset 0 0 0 1.5px var(--local); }
.mk.note.ch { background: var(--local); box-shadow: none; }
.mk.ok.ag { color: var(--local-ink); font: 700 11px/1 var(--ui); }
.mk.away { background: none; box-shadow: inset 0 0 0 1.5px var(--text-4); }
.ig { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--hair); pointer-events: none; }
/* A level's guide ends on its last row: halfway down, turning toward that row (└). */
.ig.end { bottom: 50%; }
.ig.elbow { width: 8px; background: none; border-left: 1px solid var(--hair); border-bottom: 1px solid var(--hair); border-bottom-left-radius: 4px; }
/* One line each, so a long tree can skip the rows off screen. */
.vw-side .sb-row.tr { content-visibility: auto; contain-intrinsic-size: auto 28px; }
.vw-side .sb-row.tr:focus-visible { outline-offset: -2px; }
.sb-gh { display: flex; align-items: center; gap: 6px; padding: 4px 6px 6px; font-size: 11.5px; color: var(--text-3); }
.sb-gh .sp { flex: 1; }
.sb-gh .ib { width: 24px; height: 24px; }
.sb-gh .ib svg { width: 13px; height: 13px; }
.sb-warn { margin: 2px 0 8px; padding: 9px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; line-height: 1.45; }
.sb-warn code { color: var(--text); }
.sb-pend { appearance: none; display: block; width: 100%; margin: 2px 0 8px; padding: 9px 10px; border: 0; border-radius: 8px; background: var(--gh-soft); color: var(--text); font: 600 12.5px/1.3 var(--ui); text-align: left; cursor: pointer; }
.sb-pend:hover { background: rgba(92, 157, 248, .2); }
.sb-snap { font: 500 11px/1.5 var(--code); color: var(--text-3); overflow-wrap: anywhere; }
.sb-snap code { color: var(--text-2); }

/* ---- Menus, popovers, the toast: what floats. */
.menu { position: fixed; z-index: 60; min-width: 230px; max-width: min(380px, calc(100vw - 16px)); max-height: min(70vh, 540px); overflow: auto; padding: 6px; border-radius: 12px; background: var(--raised); box-shadow: var(--float); display: grid; align-content: start; }
.menu[hidden] { display: none; }
.mi { appearance: none; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); font: 400 13px/1.3 var(--ui); text-align: left; cursor: pointer; text-decoration: none; }
.mi:hover, .mi:focus-visible { background: var(--hover); outline: none; }
.mi .ic { display: grid; place-items: center; color: var(--text-3); }
.mi .ic svg { width: 14px; height: 14px; }
.mi[aria-checked="true"] .ic { color: var(--text); }
.mi .nm { font: 500 12.5px/1.3 var(--code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi[aria-current="true"] .nm { font-weight: 700; }
.mi .own { color: var(--text-3); }
.mi .k { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.mi-h { padding: 8px 10px 4px; font-size: 11.5px; color: var(--text-3); }
.mi-sep { height: 1px; margin: 6px 4px; background: var(--hair); }
.mi-note { padding: 6px 10px 8px; font-size: 12px; line-height: 1.45; color: var(--text-3); }
.mi-foot { display: grid; padding: 6px 4px 4px; }
.mi-foot .btn:hover { background: var(--hover); color: var(--del-ink); }
/* The marks' panel: a few lines and a button. */
.menu.panel { width: min(320px, calc(100vw - 16px)); padding: 10px; }
.mi-size { display: flex; align-items: center; gap: 2px; margin: -2px -4px -4px 0; color: var(--text); font-size: 13px; }
.mi-size .sp { flex: 1; }
.mi-size .ib { width: 44px; height: 36px; color: var(--text); font: 600 13px/1 var(--ui); }
.mi-size .ib:disabled { opacity: .4; cursor: default; }
.mi-size b { min-width: 32px; text-align: center; font: 600 13px/1 var(--code); font-variant-numeric: tabular-nums; }
.menu.panel .mi-note { padding: 4px 6px 10px; font-size: 12.5px; line-height: 1.55; color: var(--text-2); }
.menu.panel .mi-note code { font-size: 11.5px; color: var(--text); white-space: nowrap; }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 80; padding: 9px 14px; border-radius: 10px; background: var(--raised); box-shadow: var(--float); color: var(--text); font: 500 13px/1.3 var(--ui); opacity: 0; transform: translateY(6px); transition: opacity var(--med) var(--ease), transform var(--med) var(--ease); pointer-events: none; }
.toast.on { opacity: 1; transform: none; }

/* ---- A view's header: where you are, what it holds, the way to the next change, one action. */
.fv-head { position: sticky; top: 0; left: 0; z-index: 5; background: var(--sheet); transition: box-shadow var(--fast) var(--ease); }
.vw-main.scrolled .fv-head { box-shadow: 0 1px 0 var(--hair); }
.fv-row { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 14px 0 22px; }
.fv-row > .sp { flex: 1; min-width: 0; }
.crumbs { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; font-size: 13.5px; color: var(--text-3); white-space: nowrap; }
.crumbs > * { flex: none; }
.crumbs .sep { color: #3A3A44; }
.crumbs b { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text); font: 600 13px/1.3 var(--code); }
.crumbs b.ui { font: 600 13.5px/1.3 var(--ui); }
/* Squeezed, a header's facts give way first, then a file's folders (the farthest first, each
   keeping its start), then its name. */
.crumbs .path { display: flex; flex: 0 100000 auto; min-width: 0; overflow: hidden; font: 500 12.5px/1.3 var(--code); }
.crumbs .path button { flex: 0 var(--far, 1) auto; min-width: 1.8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs .path .fold, .crumbs .path i { flex: none; min-width: 0; font-style: normal; }
.crumbs button { appearance: none; border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.crumbs button:hover, .crumbs button[aria-expanded="true"] { color: var(--text-2); }
.crumbs .fv-back { width: 26px; height: 26px; margin-left: -8px; color: var(--text-2); }
.crumbs .fv-back:hover { color: var(--text); }
.crumbs .fv-back svg { width: 16px; height: 16px; }
.facts { flex: 0 100000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text-3); }
.facts .cm-cnt { margin-left: 8px; }
.chip { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 3px; flex: none; height: 24px; padding: 0 5px 0 9px; border-radius: 999px; background: var(--raised); color: var(--text-2); font: 500 12px/1 var(--ui); white-space: nowrap; cursor: pointer; }
.chip:hover, .chip[aria-expanded="true"] { background: var(--hover); color: var(--text); }
.chip svg { width: 13px; height: 13px; }
.fv-row .tools { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.fv-row .btn { flex: none; }
.cm-cnt { display: inline-flex; align-items: center; gap: 3px; color: var(--gh); font: 500 11.5px/1 var(--ui); white-space: nowrap; }
.cm-cnt.note { color: var(--local); }
.cm-cnt + .cm-cnt { margin-left: 6px; }
.cm-cnt svg { width: 12px; height: 12px; }
/* Notes under a header: one quiet line each. */
.fv-note { position: sticky; left: 0; max-width: min(760px, 100%); padding: 0 22px 12px; font-size: 12.5px; line-height: 1.5; color: var(--text-3); }
.fv-note code { color: var(--text-2); }
.fv-note.warm { color: var(--accent-ink); }
.cm-note { position: sticky; left: 0; display: grid; gap: 6px; max-width: min(760px, 100%); padding: 0 22px 14px; font-size: 12.5px; line-height: 1.5; color: var(--text-2); overflow-wrap: anywhere; }
.cm-note p { margin: 0; }
.cm-subj { color: var(--text); font-weight: 600; }
.cm-subj .tag { font-weight: 500; vertical-align: 1px; }
.cm-text { white-space: pre-wrap; }
.cm-rel { color: var(--text-3); }
.cm-note code { font-size: 11.5px; color: var(--text-2); }
.cm-note a { color: var(--gh); text-decoration: none; } .cm-note a:hover { text-decoration: underline; }
.cm-note .linkish { justify-self: start; }
/* A chain's members in a row, root first; Graph opens the drawing. */
.strip { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 22px 14px; }
.strip > .sp { flex: 1; }
.node { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 7px; max-width: 300px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--raised); color: var(--text); font: 500 12px/1 var(--code); white-space: nowrap; cursor: pointer; transition: background-color var(--fast) var(--ease); }
.node:hover { background: var(--hover); }
.node.root { box-shadow: inset 0 0 0 1px var(--text-3); }
.node .nm { overflow: hidden; text-overflow: ellipsis; }
.node .c { font: 500 11.5px/1 var(--ui); color: var(--text-3); font-variant-numeric: tabular-nums; }
.node.done .nm { color: var(--text-3); }
.node.ui { font-family: var(--ui); font-size: 12.5px; }
/* In the pinned strip: the member being read. */
.node.here { background: var(--hover); box-shadow: inset 0 0 0 1px #4A4A55; }
.node.root.here { box-shadow: inset 0 0 0 1px var(--text-3); }
.fv-head .strip { padding-bottom: 12px; }
.strip .arr { color: var(--text-3); font-size: 13px; }
/* By commit, under a chain's members: who wrote its lines, a thin bar of one part per commit
   (taller than it looks, to be easy to point at), then how many commits and where else they wrote. */
.wb { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; max-width: min(1040px, 100%); padding: 0 14px 10px 22px; margin-top: -2px; }
.fv-head .strip + .wb { margin-top: -4px; }
.wb-bar { display: flex; gap: 2px; flex: 1 1 260px; min-width: 160px; height: 18px; margin-right: 8px; }
.wb-seg { appearance: none; position: relative; flex: 1 1 0; min-width: 4px; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.wb-seg::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--text-4); transition: background-color var(--fast) var(--ease), opacity var(--fast) var(--ease), transform var(--fast) var(--ease); }
.wb-seg.own::before { background: var(--text-2); }
.wb-seg:hover::before, .wb-seg.hl::before { background: var(--text); transform: scaleY(1.5); }
.wb-seg.in::before { background: var(--accent); }
.vw.w-lit .wb-seg:not(.hl):not(.in)::before { opacity: .4; }
.wb-seg:focus-visible { outline-offset: 0; border-radius: 3px; }
.wb .lnk { height: 26px; font-size: 12px; }
.wb-n { padding: 0 8px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.wb .lnk[aria-expanded="true"] { color: var(--text); background: var(--raised); }
.wb .lnk svg { width: 12px; height: 12px; }
.lnk { appearance: none; border: 0; background: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--text-2); font: 500 12.5px/1 var(--ui); cursor: pointer; }
.lnk:hover, .lnk[aria-pressed="true"] { color: var(--text); background: var(--raised); }
.lnk svg { width: 13px; height: 13px; }
.focus-bar { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 22px 12px; padding: 8px 8px 8px 12px; border-radius: 8px; background: var(--raised); font-size: 12.5px; color: var(--text-2); max-width: min(760px, calc(100% - 44px)); }
.focus-bar b { color: var(--text); font-family: var(--code); font-weight: 600; }
.focus-bar .sp { flex: 1; }

/* The graphs: a chain's members, the chain map. */
.graph-box { position: sticky; left: 0; display: grid; gap: 8px; padding: 0 22px 16px; }
/* The chain's graph from the header: the member being read beside its button; dropped over the code
   anywhere, under the pinned header, with the member being read ringed. */
.fv-here { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; max-width: 320px; margin-right: 8px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
.fv-here b { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 600 12.5px/1.3 var(--code); color: var(--text); }
.fv-here:empty { display: none; }
.fv-row [data-act="graph"].took { animation: gdtook 600ms var(--ease) 1; }
@keyframes gdtook { 0% { box-shadow: 0 0 0 0 rgba(233, 180, 76, .6); background: var(--accent-soft); } 100% { box-shadow: 0 0 0 9px rgba(233, 180, 76, 0); } }
.gd-w { position: sticky; top: var(--hh, 52px); left: 0; z-index: 6; height: 0; }
.gd { position: absolute; top: 0; left: 12px; right: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: min(540px, calc(100vh - var(--hh, 52px) - 140px)); border-radius: 0 0 12px 12px; background: var(--raised); box-shadow: 0 0 0 1px var(--hair-2), 0 24px 48px -12px rgba(0, 0, 0, .8); }
.gd[hidden] { display: none; }
.gd-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 0; }
.gd-tabs button { appearance: none; border: 0; height: 26px; max-width: 300px; padding: 0 10px; border-radius: 6px; background: transparent; color: var(--text-3); font: 500 12px/1 var(--code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.gd-tabs button:hover { color: var(--text-2); }
.gd-tabs button[aria-selected="true"] { background: var(--hover); color: var(--text); }
.gd-scroll { min-height: 0; margin: 8px 8px 0; overflow: auto; overscroll-behavior: contain; border-radius: 8px; background: var(--ground); scrollbar-width: thin; scrollbar-color: var(--hair-2) transparent; }
.gd-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 9px 14px 11px; font-size: 12px; color: var(--text-3); }
.gd-foot b { font: 600 12px/1.3 var(--code); color: var(--text); }
.gd-foot .sp { flex: 1; }
.gd-foot kbd { font-size: 10.5px; }
.g-node.here .g-box { stroke: var(--accent); stroke-width: 2; fill: #241F14; }
.g-node.here, .g-more.here { filter: drop-shadow(0 0 8px rgba(233, 180, 76, .35)); }
.g-more.here rect { stroke: var(--accent); stroke-dasharray: none; }
.graph-scroll { overflow: auto; max-height: 420px; border-radius: 10px; background: var(--ground); }
.graph-scroll.tall { max-height: none; }
.graph { display: block; color: #8A8A95; }
.g-node { cursor: pointer; }
.g-box { fill: var(--raised); stroke: var(--hair-2); stroke-width: 1; }
.g-node.root .g-box { stroke: var(--text-3); stroke-width: 1.5; }
.g-node.focus .g-box { stroke: var(--text); stroke-width: 2; fill: var(--hover); }
.g-node.dim, .g-edge.dim { opacity: .28; }
.g-edge.long { opacity: .22; }
.g-edge.share { stroke-dasharray: 5 4; }
.g-node.grp .g-box { stroke-dasharray: 5 3; }
.g-bar { fill: var(--accent); }
.g-node.ok .g-bar { fill: var(--done); }
.g-node:hover .g-box, .g-node:focus-visible .g-box { stroke: var(--text-2); stroke-width: 1.5; }
.g-node:focus-visible { outline: none; }
.g-l1 { fill: var(--text-3); font: 500 10.5px var(--ui); }
.g-l2 { fill: var(--text); font: 600 12px var(--code); }
.g-node.ui .g-l2 { font: 600 12px var(--ui); }
.g-node.ext .g-box { stroke-dasharray: 1.5 3; stroke-linecap: round; stroke-width: 1.5; fill: transparent; }
.g-node.ext .g-bar { fill: var(--text-4); }
.g-node.ext .g-l2 { fill: var(--text-2); }
.g-node.ok .g-l2 { fill: var(--text-3); }
.g-cnt { fill: var(--text-3); font: 500 10.5px var(--ui); }
.g-edge { fill: none; stroke: currentColor; stroke-width: 1.2; }
.g-elabel { fill: var(--text-2); font: 500 10.5px var(--code); paint-order: stroke; stroke: var(--ground); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.g-more { cursor: pointer; }

.lg-open { background: var(--accent); } .lg-ok { background: var(--done); }

/* ---- The commits. A lens: lines outside it fade, and a member with nothing in it steps back. */
.ln.lens-out, .half.lens-out, .sl.lens-out > .g { opacity: .36; }
.vw.w-lit .vw-main .ln > :not(.g), .vw.w-lit .vw-main .half { transition: opacity var(--fast) var(--ease); }

.g-node.out .g-bar { fill: var(--text-4); }

.lens-offer i { font-style: normal; font-weight: 600; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.lens-offer:hover { background: var(--hover); color: var(--text); }
/* The head commit, and the lens once one is on: "Changes from". */
.t-head { appearance: none; display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 300px; border: 0; background: none; padding: 4px 4px 4px 6px; margin: 0 -4px 0 -6px; border-radius: 6px; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }

.menu.lens-pop { width: min(460px, calc(100vw - 16px)); max-width: none; max-height: min(78vh, 680px); padding: 0; overflow: hidden; grid-template-rows: auto auto minmax(0, 1fr) auto; }
.lp-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 16px 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.lp-h b { font-size: 13px; font-weight: 600; color: var(--text); }
.lp-h code, .lp-pre em code, .lp-row code, .lp-f code { font: 500 11px var(--code); color: var(--text-3); }
.lp-pres { display: grid; padding: 2px 6px 6px; }
.lp-pre { appearance: none; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); font: 400 13px/1.3 var(--ui); text-align: left; cursor: pointer; }
.lp-pre:hover, .lp-pre:focus-visible { background: var(--hover); outline: none; }

.lp-pre span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.lp-pre b { font-weight: 500; font-size: 12px; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.lp-list { display: grid; align-content: start; min-height: 0; overflow: auto; margin: 0 6px; padding: 6px 0; border-top: 1px solid var(--hair); }
.lp-row { appearance: none; display: grid; grid-template-columns: auto 56px minmax(0, 1fr) auto; align-items: center; column-gap: 8px; width: 100%; height: 30px; padding: 0 10px 0 0; border: 0; border-radius: 6px; background: none; color: var(--text); font: 400 12.5px/1.25 var(--ui); text-align: left; cursor: pointer; }
.lp-row > .lanes { align-self: stretch; }

.lp-row.in { background: var(--accent-soft); }

.lp-row.gone .lp-s, .lp-row.old-head .lp-s { color: var(--text-3); }
.lp-s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-row .cm-n { grid-row: auto; grid-column: auto; }

.lp-flag:hover, .lp-flag:focus-visible { background: var(--hover); outline: none; }
.lp-flag.in { background: var(--accent-soft); }
.lens-pop .lanes .dot.gone, .lens-pop .lanes .dot.ghost, .lens-pop .lanes .stub-end { fill: var(--raised); }
.lp-f { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 8px 16px; border-top: 1px solid var(--hair); font-size: 11.5px; color: var(--text-3); }
.lp-f span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lp-f .btn { background: var(--hover); }
.lp-f .btn:hover { background: var(--hair-2); }
/* Lanes: the branch in grey, other lanes lighter, an old head's dashed. */
.lanes { display: block; flex: none; overflow: visible; }
.lanes .lane { fill: none; stroke: #4A4A55; stroke-width: 1.5; }
.lanes .lane.side { stroke: #6F6F7A; }
